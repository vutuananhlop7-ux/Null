<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhảy Dù Định Mệnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#170f36;
    --sky-upper:#3d1f5e;
    --sky-mid:#9c3f7a;
    --sky-bot:#ff8f5c;
    --sky-horizon:#ffd39a;
    --mtn-far:#4a3068;
    --mtn-near:#2a1a44;
    --grass-a:#5fc26b;
    --grass-b:#399148;
    --glow:#ffd166;
    --mint:#2fe0bc;
    --danger:#ff5b5b;
    --cream:#fff7ed;
    --ink:#f5f0ff;
    --ink-dim:#d9c9f0;
    --glass:rgba(255,255,255,0.09);
    --glass-brd:rgba(255,255,255,0.2);
    --tree:#1f5c33;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    width:100%;
    overflow:hidden;
    font-family:"Be Vietnam Pro", sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-upper) 32%, var(--sky-mid) 62%, var(--sky-bot) 100%);
  }

  /* ---------- AMBIENT BACKDROP ---------- */
  .sun-glow{
    position:fixed;
    right:8vw;
    top:10vh;
    width:min(30vw, 320px);
    height:min(30vw, 320px);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,214,140,0.85), rgba(255,159,92,0.35) 55%, transparent 72%);
    filter:blur(2px);
    z-index:0;
    pointer-events:none;
  }

  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; }
    50%{ opacity:0.9; }
  }

  .shooting-star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 6px 1px rgba(255,255,255,0.8);
    animation:shoot 1.1s ease-out forwards;
  }
  .shooting-star::before{
    content:"";
    position:absolute;
    right:1px;
    top:0;
    width:70px;
    height:1.5px;
    background:linear-gradient(to left, rgba(255,255,255,0.9), transparent);
    transform-origin:right center;
  }
  @keyframes shoot{
    0%{ transform:translate(0,0); opacity:1; }
    100%{ transform:translate(-220px, 130px); opacity:0; }
  }

  .clouds{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .cloud{
    position:absolute;
    background:rgba(255,255,255,0.45);
    border-radius:50px;
    animation:drift linear infinite;
    filter:blur(0.3px);
  }
  .cloud.far{
    background:rgba(255,255,255,0.22);
    filter:blur(1.5px);
  }
  @keyframes drift{
    from{ transform:translateX(-20vw); }
    to{ transform:translateX(120vw); }
  }

  .bird{
    position:absolute;
    animation:birdFly linear infinite;
  }
  .bird span{
    display:inline-block;
    font-size:13px;
    opacity:0.75;
    animation:birdFlap 0.6s ease-in-out infinite alternate;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }
  @keyframes birdFly{
    from{ transform:translateX(-10vw); }
    to{ transform:translateX(110vw); }
  }
  @keyframes birdFlap{
    from{ transform:translateY(0) scaleY(1); }
    to{ transform:translateY(-3px) scaleY(0.85); }
  }

  .plane{
    position:fixed;
    top:6vh;
    font-size:26px;
    z-index:2;
    animation:planeFly 9s linear infinite;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.4));
  }
  @keyframes planeFly{
    0%{ transform:translateX(-10vw) scaleX(1); }
    48%{ transform:translateX(105vw) scaleX(1); }
    50%{ transform:translateX(105vw) scaleX(-1); }
    98%{ transform:translateX(-10vw) scaleX(-1); }
    100%{ transform:translateX(-10vw) scaleX(1); }
  }

  .stage{
    position:relative;
    z-index:3;
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2.2vh 3vw 1.6vh;
    text-align:center;
    gap:1.4vh;
  }
  .stage::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(10,5,22,0.4) 100%);
  }

  .title-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; }

  h1{
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:clamp(24px, 3.6vw, 38px);
    margin:0;
    letter-spacing:0.2px;
  }
  h1 .chute-ico{
    display:inline-block;
    transform:translateY(2px);
    filter:drop-shadow(0 3px 4px rgba(23,15,54,0.5));
    animation:swingIco 2.6s ease-in-out infinite;
  }
  @keyframes swingIco{
    0%,100%{ transform:translateY(2px) rotate(-6deg); }
    50%{ transform:translateY(2px) rotate(6deg); }
  }
  h1 .title-text{
    background:linear-gradient(90deg,#fff8e6,var(--glow),#ffb877,#fff8e6);
    background-size:280% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleShine 5s linear infinite;
    filter:drop-shadow(0 3px 6px rgba(23,15,54,0.55));
  }
  @keyframes titleShine{ to{ background-position:280% center; } }

  .title-divider{
    width:130px;
    height:3px;
    border-radius:999px;
    background:linear-gradient(90deg, transparent, var(--glow), transparent);
    opacity:0.8;
  }

  .subtitle{
    margin:0;
    color:var(--ink-dim);
    font-size:clamp(10.5px, 1.2vw, 13.5px);
    max-width:560px;
  }

  /* ---------- CONSOLE BAR ---------- */
  .console-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(12px, 2.4vw, 26px);
    flex-wrap:wrap;
    width:100%;
    max-width:720px;
    background:var(--glass);
    border:1px solid var(--glass-brd);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:20px;
    padding:12px 20px;
    box-shadow:0 12px 30px -16px rgba(0,0,0,0.5);
  }

  .start-btn{
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:clamp(13px, 1.8vw, 17px);
    color:#3a2400;
    background:linear-gradient(180deg, #ffe28a, var(--glow));
    border:none;
    border-bottom:4px solid #d99a1f;
    padding:10px 26px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 18px -6px rgba(0,0,0,0.4);
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    white-space:nowrap;
  }
  .start-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 22px -6px rgba(0,0,0,0.45); filter:brightness(1.04); }
  .start-btn:active{ transform:translateY(1px); }
  .start-btn:disabled{ opacity:0.55; cursor:default; transform:none; animation:none; }
  .start-btn:not(:disabled){ animation:idlePulse 2.6s ease-in-out infinite; }
  @keyframes idlePulse{
    0%,100%{ box-shadow:0 8px 18px -6px rgba(0,0,0,0.4), 0 0 0 0 rgba(255,209,102,0.5); }
    50%{ box-shadow:0 8px 18px -6px rgba(0,0,0,0.4), 0 0 0 8px rgba(255,209,102,0); }
  }

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:180px;
  }
  .progress-track{
    flex:1;
    height:10px;
    border-radius:999px;
    background:rgba(255,255,255,0.16);
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.25);
    position:relative;
  }
  .progress-fill{
    position:relative;
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, #ff5b5b, #ffd166, #2fe0bc);
    background-size:200% 100%;
    transition:width .4s ease;
    overflow:hidden;
  }
  .progress-fill::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    width:40%;
    animation:sheen 1.8s linear infinite;
  }
  @keyframes sheen{
    from{ transform:translateX(-120%); }
    to{ transform:translateX(320%); }
  }
  .progress-label{
    font-size:clamp(10px, 1.1vw, 12px);
    color:var(--ink-dim);
    white-space:nowrap;
    font-weight:600;
  }

  .leader-chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:clamp(10px, 1.1vw, 12.5px);
    font-weight:700;
    color:#3a2400;
    background:linear-gradient(180deg, #ffe28a, var(--glow));
    padding:6px 14px;
    border-radius:999px;
    white-space:nowrap;
    box-shadow:0 6px 14px -6px rgba(0,0,0,0.4);
    opacity:0;
    transform:translateY(4px) scale(0.95);
    transition:opacity .25s ease, transform .25s ease;
    max-width:180px;
    overflow:hidden;
  }
  .leader-chip.show{ opacity:1; transform:translateY(0) scale(1); }
  .leader-chip #leaderName{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .leader-chip.danger{
    background:linear-gradient(180deg, #ff9d3d, var(--danger));
    color:#fff;
  }

  /* ---------- SKY / DROP ZONE ---------- */
  .sky-wrap{
    position:relative;
    width:100%;
    max-width:1000px;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 16px 40px -16px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.12), inset 0 40px 60px -40px rgba(255,255,255,0.25);
  }
  .sky-wrap.shake{ animation:shakeSky .4s ease; }
  @keyframes shakeSky{
    10%,90%{ transform:translateX(-3px); }
    20%,80%{ transform:translateX(4px); }
    30%,50%,70%{ transform:translateX(-6px); }
    40%,60%{ transform:translateX(6px); }
  }

  .sky-wrap::before, .sky-wrap::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:13%;
    z-index:6;
    pointer-events:none;
    opacity:0;
    transition:opacity .35s ease;
  }
  .sky-wrap::before{ top:0; background:linear-gradient(to bottom, rgba(5,2,12,0.45), transparent); }
  .sky-wrap::after{ bottom:0; background:linear-gradient(to top, rgba(5,2,12,0.45), transparent); }
  .sky-wrap.cam-active::before, .sky-wrap.cam-active::after{ opacity:1; }

  .bank{
    position:relative;
    height:14px;
    flex-shrink:0;
    background:repeating-linear-gradient(90deg, var(--grass-a) 0 5px, var(--grass-b) 5px 10px);
    z-index:3;
    box-shadow:0 -6px 14px -6px rgba(0,0,0,0.35) inset;
  }
  .bank::before{
    content:"";
    position:absolute;
    left:0; right:0; top:-6px;
    height:6px;
    background:repeating-linear-gradient(115deg, transparent 0 10px, rgba(46,110,58,0.9) 10px 12px);
    opacity:0.9;
  }
  .bank::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:100%;
    height:9px;
    background-image:
      linear-gradient(130deg, var(--tree) 45%, transparent 45.5%),
      linear-gradient(230deg, var(--tree) 45%, transparent 45.5%);
    background-size:16px 9px;
    background-position:0 bottom;
    opacity:0.7;
  }

  .sky{
    position:relative;
    flex:1;
    min-height:0;
    overflow-x:auto;
    overflow-y:hidden;
    background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0) 45%, rgba(0,0,0,0.08) 100%);
  }
  .sky::-webkit-scrollbar{ height:8px; }
  .sky::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.35); border-radius:4px; }

  .jumpers{
    position:relative;
    display:flex;
    align-items:stretch;
    height:100%;
    padding:0 10px;
    width:max-content;
  }

  .scenery{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .mtn-far, .mtn-near{
    position:absolute;
    left:-40px;
    right:-40px;
    bottom:0;
    background-repeat:repeat-x;
    background-position:bottom left;
  }
  .mtn-far{
    height:38%;
    opacity:0.55;
    background-image:
      linear-gradient(135deg, var(--mtn-far) 24%, transparent 24.6%),
      linear-gradient(225deg, var(--mtn-far) 24%, transparent 24.6%);
    background-size:90px 90px;
  }
  .mtn-near{
    height:26%;
    opacity:0.85;
    background-image:
      linear-gradient(135deg, var(--mtn-near) 24%, transparent 24.6%),
      linear-gradient(225deg, var(--mtn-near) 24%, transparent 24.6%);
    background-size:60px 60px;
  }

  .jumper{
    position:relative;
    z-index:1;
    width:30px;
    height:100%;
    flex-shrink:0;
  }

  .jumper-shadow{
    position:absolute;
    left:50%;
    bottom:4px;
    width:20px;
    height:7px;
    border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,0,0,0.55), transparent 75%);
    transform:translate(-50%, 0) scale(0.3);
    opacity:0;
    z-index:0;
    transition:opacity .1s linear;
  }

  .jumper-figure{
    position:absolute;
    left:50%;
    top:0;
    width:32px;
    height:40px;
    transform:translate(-50%, 0px);
    will-change:transform;
    z-index:2;
  }
  .jumper-figure svg{ width:100%; height:100%; overflow:visible; display:block; }
  .jumper-figure::before,
  .jumper-figure::after{
    content:"";
    position:absolute;
    top:-13px;
    width:1.6px;
    height:12px;
    background:linear-gradient(to bottom, transparent, rgba(255,255,255,0.6));
    animation:trailFlicker 0.5s ease-in-out infinite alternate;
  }
  .jumper-figure::before{ left:38%; }
  .jumper-figure::after{ left:60%; animation-delay:0.15s; }
  @keyframes trailFlicker{
    from{ opacity:0.15; height:8px; }
    to{ opacity:0.6; height:13px; }
  }
  .jumper.landed .jumper-figure::before,
  .jumper.landed .jumper-figure::after,
  .jumper.failing .jumper-figure::before,
  .jumper.failing .jumper-figure::after,
  .jumper.ground-fail .jumper-figure::before,
  .jumper.ground-fail .jumper-figure::after{
    display:none;
  }

  .canopy-group{ transform-origin:50% 60%; }
  .jumper.failing .canopy-group{
    animation:tearCanopy .35s ease forwards;
  }
  @keyframes tearCanopy{
    to{ transform:scale(0.15) rotate(30deg); opacity:0; }
  }
  .jumper.failing .person-group{
    animation:spinFall .45s linear infinite;
  }
  @keyframes spinFall{
    to{ transform:rotate(360deg); }
  }
  .jumper.ground-fail .person-group{
    animation:groundCollapse .5s ease forwards;
  }
  @keyframes groundCollapse{
    to{ transform:rotate(85deg) translateY(4px); opacity:0.55; }
  }
  .jumper.landed .person-group{
    animation:landBounce .35s ease;
  }
  @keyframes landBounce{
    0%{ transform:scaleY(1); }
    45%{ transform:scaleY(0.72) translateY(3px); }
    100%{ transform:scaleY(1); }
  }

  .fail-tag{
    position:absolute;
    left:50%;
    top:-6px;
    transform:translate(-50%,-100%) scale(0.7);
    background:linear-gradient(90deg,#ff5b5b,#ff9d3d);
    color:#fff;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    z-index:5;
    box-shadow:0 6px 14px -4px rgba(0,0,0,0.5);
  }
  .fail-tag.show{
    animation:tagPop .4s cubic-bezier(.34,1.7,.64,1) forwards;
  }
  @keyframes tagPop{
    0%{ opacity:0; transform:translate(-50%,-80%) scale(0.3); }
    70%{ opacity:1; transform:translate(-50%,-115%) scale(1.15); }
    100%{ opacity:1; transform:translate(-50%,-105%) scale(1); }
  }

  .crown-tag{
    position:absolute;
    left:50%;
    top:-6px;
    transform:translate(-50%,-100%) scale(0.7);
    font-size:14px;
    opacity:0;
    pointer-events:none;
    z-index:5;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,0.5));
  }
  .jumper.leading .crown-tag{
    animation:crownPop .35s cubic-bezier(.34,1.7,.64,1) forwards, crownBob 1s ease-in-out infinite .35s;
  }
  @keyframes crownPop{
    0%{ opacity:0; transform:translate(-50%,-80%) scale(0.3); }
    100%{ opacity:1; transform:translate(-50%,-100%) scale(1); }
  }
  @keyframes crownBob{
    0%,100%{ transform:translate(-50%,-100%) scale(1) rotate(-6deg); }
    50%{ transform:translate(-50%,-108%) scale(1) rotate(6deg); }
  }
  .jumper.leading .jumper-figure{
    animation:leaderGlow 1s ease-in-out infinite;
  }
  @keyframes leaderGlow{
    0%,100%{ filter:drop-shadow(0 0 4px rgba(255,209,102,0.75)); }
    50%{ filter:drop-shadow(0 0 12px rgba(255,209,102,0.95)); }
  }

  .empty-sky{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    width:100%;
    color:rgba(255,255,255,0.85);
    font-size:13px;
    padding:20px;
  }

  /* ---------- BOTTOM ---------- */
  .bottom-row{ width:100%; display:flex; justify-content:center; }
  details.list-toggle{
    display:inline-block;
  }
  details.list-toggle summary{
    cursor:pointer;
    color:rgba(255,255,255,0.9);
    font-size:clamp(10px, 1.1vw, 12.5px);
    list-style:none;
    font-weight:600;
    background:var(--glass);
    border:1px solid var(--glass-brd);
    padding:7px 16px;
    border-radius:999px;
    transition:background .15s ease;
  }
  details.list-toggle summary:hover{ background:rgba(255,255,255,0.16); }
  details.list-toggle summary::-webkit-details-marker{ display:none; }
  details.list-toggle summary::before{ content:"🪂 "; }

  .finished-pop{
    position:fixed;
    bottom:6vh;
    left:50%;
    transform:translateX(-50%);
    background:var(--cream);
    color:#3a2f1a;
    border-radius:14px;
    padding:14px 22px;
    font-size:12.5px;
    line-height:1.9;
    box-shadow:0 20px 40px -14px rgba(0,0,0,0.6);
    z-index:8;
    max-width:70vw;
    max-height:60vh;
    overflow:auto;
    text-align:left;
  }
  .finished-pop .pop-grid{ columns:3; column-gap:20px; }
  .name-done{ text-decoration:line-through; opacity:0.5; }

  /* ---------- REVEAL BANNER ---------- */
  .reveal-banner{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
    background:rgba(15,6,10,0.6);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .reveal-banner.show{ opacity:1; pointer-events:auto; }
  .reveal-card{
    background:var(--cream);
    color:#3a2f1a;
    border-radius:22px;
    padding:32px 44px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.65);
    transform:scale(0.8) translateY(20px);
    transition:transform .35s cubic-bezier(.34,1.6,.64,1);
    position:relative;
  }
  .reveal-banner.show .reveal-card{ transform:scale(1) translateY(0); }
  .reveal-card::before{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:26px;
    background:conic-gradient(from 0deg, #ff5b5b, #ffd166, #ff9d3d, #ff5b5b);
    animation:spinBorder 3s linear infinite;
    z-index:-1;
  }
  @keyframes spinBorder{ to{ transform:rotate(360deg); } }
  .reveal-skull{
    position:relative;
    font-size:clamp(30px, 5vw, 46px);
    display:inline-block;
    animation:skullBob 1.4s ease-in-out infinite;
  }
  .reveal-skull::before{
    content:"";
    position:absolute;
    left:50%; top:50%;
    width:180%; height:180%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,209,102,0.55), transparent 70%);
    z-index:-1;
    animation:glowPulse 1.4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:0.5; }
    50%{ opacity:1; }
  }
  @keyframes skullBob{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-5px) rotate(4deg); }
  }
  .reveal-label{
    margin:8px 0 2px;
    font-size:13px;
    color:#a3936a;
    font-weight:700;
    letter-spacing:0.3px;
  }
  .reveal-name{
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:clamp(28px, 5vw, 42px);
    margin:0 0 6px;
    background:linear-gradient(90deg,#ff5b5b,#ff9d3d,#ffd166,#ff5b5b);
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shineText 3s linear infinite;
  }
  @keyframes shineText{ to{ background-position:300% center; } }
  .reveal-sub{
    font-size:12px;
    color:#8a7c5c;
    margin:0 0 20px;
  }
  .reveal-next{
    font-family:"Be Vietnam Pro", sans-serif;
    font-weight:600;
    font-size:13.5px;
    background:var(--mint);
    color:#0d2338;
    border:none;
    padding:10px 26px;
    border-radius:999px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 18px -8px rgba(47,224,188,0.7);
  }
  .reveal-next:hover{ transform:translateY(-2px); box-shadow:0 12px 22px -8px rgba(47,224,188,0.8); }

  #debrisHost{
    position:fixed;
    inset:0;
    z-index:18;
    pointer-events:none;
  }
  .debris{
    position:absolute;
    top:0; left:0;
    border-radius:2px;
    opacity:0.95;
    animation:debrisFall 1.1s ease-in forwards;
  }
  @keyframes debrisFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--drift), 40vh) rotate(var(--spin)); opacity:0; }
  }
  .puff{
    position:absolute;
    top:0; left:0;
    width:8px; height:8px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    opacity:0.9;
    animation:puffOut .5s ease-out forwards;
  }
  @keyframes puffOut{
    to{ transform:translate(var(--dx), var(--dy)) scale(1.8); opacity:0; }
  }
  .confetti{
    position:absolute;
    top:-16px; left:0;
    width:7px; height:12px;
    opacity:0.95;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--drift), 90vh) rotate(var(--spin)); opacity:0; }
  }

  .round-toast{
    position:fixed;
    top:4vh;
    left:50%;
    transform:translateX(-50%) translateY(-14px);
    background:linear-gradient(90deg, #ff5b5b, #ff9d3d);
    color:#fff;
    font-weight:700;
    font-size:clamp(12px, 1.6vw, 16px);
    padding:10px 24px;
    border-radius:999px;
    box-shadow:0 14px 30px -10px rgba(0,0,0,0.6);
    opacity:0;
    z-index:30;
    pointer-events:none;
    transition:opacity .4s ease, transform .4s ease;
  }
  .round-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }

  @media (max-width:640px){
    .console-bar{ flex-direction:column; }
    .progress-wrap{ width:100%; }
  }
</style>
</head>
<body>

<div class="sun-glow"></div>
<div class="stars" id="stars"></div>
<div class="clouds" id="clouds"></div>
<div class="plane">🛩️</div>

<div class="stage">
  <div class="title-wrap">
    <h1><span class="chute-ico">🪂</span> <span class="title-text">Nhảy Dù Định Mệnh</span></h1>
    <div class="title-divider"></div>
    <p class="subtitle">Bấm "Thả dù" — cả 37 người cùng nhảy. Mỗi lượt chỉ đúng 1 người xui gặp sự cố, ngẫu nhiên hoàn toàn — không nhất thiết là người đáp đất đầu tiên!</p>
  </div>

  <div class="console-bar">
    <button class="start-btn" id="startBtn">🪂 Thả dù!</button>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">0/37 đã nhảy · Vòng 1</span>
    </div>
    <div class="leader-chip" id="leaderChip"><span id="leaderIco">🏆</span><span id="leaderName">—</span></div>
  </div>

  <div class="sky-wrap" id="skyWrap">
    <div class="sky" id="sky">
      <div class="jumpers" id="jumpers"></div>
    </div>
    <div class="bank"></div>
  </div>

  <div class="bottom-row">
    <details class="list-toggle" id="finishedToggle">
      <summary>Xem thứ tự đã "dính"</summary>
    </details>
  </div>
</div>

<div id="debrisHost"></div>
<div class="round-toast" id="roundToast"></div>

<div class="reveal-banner" id="revealBanner">
  <div class="reveal-card">
    <div class="reveal-skull">💀</div>
    <p class="reveal-label">KHÔNG MAY RỒI</p>
    <p class="reveal-name" id="revealName">—</p>
    <p class="reveal-sub">Dù lỗi ở lượt thứ <span id="revealRank">1</span> · Vòng <span id="revealRound">1</span> 😅</p>
    <button class="reveal-next" id="nextBtn">Nhảy tiếp</button>
  </div>
</div>

<script>
  const names = ["Đức","Bảo Hân","Võ My","Nhi An","Tiến","Gia Như","Quý","Ngọc","Kiệt","Nhân","Tùng","Thảo Ly","Vỹ","Thùy An","Trâm","Bảo Nhi","Ng My","Bảo Châu","Anh Thư","P.Huy","Ngọc Nhi","Oanh","Thảo Nguyên","Đ.Huy","Huy Hoàng","Khánh Ly","Linh","Quốc","Cái Ý","Trần Ý","Tài","Quỳnh Như","Phúc","Lan Anh","Nhật","P.Vy","Toàn"];
  const chuteColors = ['#ff6fb0','#6b8cff','#2fe0bc','#ffd166','#ff9d3d','#c99bff','#ff6b6b','#5fd3ff'];

  // ---- mây trôi trang trí (2 lớp để tạo chiều sâu) ----
  const cloudHost = document.getElementById('clouds');
  for(let i = 0; i < 5; i++){
    const c = document.createElement('div');
    c.className = 'cloud far';
    const w = 40 + Math.random() * 50;
    c.style.width = w + 'px';
    c.style.height = (w * 0.4) + 'px';
    c.style.top = (2 + Math.random() * 22) + '%';
    c.style.animationDuration = (40 + Math.random() * 26) + 's';
    c.style.animationDelay = (-Math.random() * 40) + 's';
    cloudHost.appendChild(c);
  }
  for(let i = 0; i < 6; i++){
    const c = document.createElement('div');
    c.className = 'cloud';
    const w = 60 + Math.random() * 60;
    c.style.width = w + 'px';
    c.style.height = (w * 0.4) + 'px';
    c.style.top = (5 + Math.random() * 30) + '%';
    c.style.animationDuration = (28 + Math.random() * 22) + 's';
    c.style.animationDelay = (-Math.random() * 30) + 's';
    cloudHost.appendChild(c);
  }

  // ---- chim bay ngang trời ----
  for(let i = 0; i < 3; i++){
    const b = document.createElement('div');
    b.className = 'bird';
    b.style.top = (12 + Math.random() * 20) + '%';
    b.style.animationDuration = (16 + Math.random() * 10) + 's';
    b.style.animationDelay = (-Math.random() * 20) + 's';
    const s = document.createElement('span');
    s.textContent = '🕊️';
    s.style.animationDelay = (-Math.random() * 0.6) + 's';
    b.appendChild(s);
    cloudHost.appendChild(b);
  }

  // ---- sao lấp lánh ----
  const starHost = document.getElementById('stars');
  for(let i = 0; i < 45; i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = (Math.random() * 42) + '%';
    const sz = 1 + Math.random() * 1.6;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.animationDuration = (1.6 + Math.random() * 2.6) + 's';
    s.style.animationDelay = (-Math.random() * 4) + 's';
    starHost.appendChild(s);
  }

  // ---- sao băng thỉnh thoảng lướt qua ----
  function scheduleShootingStar(){
    const delay = 5000 + Math.random() * 9000;
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'shooting-star';
      s.style.left = (30 + Math.random() * 50) + '%';
      s.style.top = (4 + Math.random() * 18) + '%';
      starHost.appendChild(s);
      setTimeout(() => s.remove(), 1200);
      scheduleShootingStar();
    }, delay);
  }
  scheduleShootingStar();

  const skyWrap = document.getElementById('skyWrap');
  const sky = document.getElementById('sky');
  const jumpersHost = document.getElementById('jumpers');
  const startBtn = document.getElementById('startBtn');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const finishedToggle = document.getElementById('finishedToggle');
  const revealBanner = document.getElementById('revealBanner');
  const revealName = document.getElementById('revealName');
  const revealRank = document.getElementById('revealRank');
  const revealRound = document.getElementById('revealRound');
  const nextBtn = document.getElementById('nextBtn');
  const debrisHost = document.getElementById('debrisHost');
  const roundToast = document.getElementById('roundToast');
  const leaderChip = document.getElementById('leaderChip');
  const leaderName = document.getElementById('leaderName');
  const leaderIco = document.getElementById('leaderIco');

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  const SCENERY_HTML = `
    <div class="scenery">
      <div class="mtn-far"></div>
      <div class="mtn-near"></div>
    </div>`;

  const PARACHUTE_SVG = `
    <svg viewBox="0 0 40 62" xmlns="http://www.w3.org/2000/svg">
      <g class="canopy-group">
        <path d="M2,22 Q2,4 20,4 Q38,4 38,22 Q20,14 2,22 Z" fill="currentColor"/>
        <path d="M2,22 Q9,16 14,14 L14,20 Q8,20.5 2,22 Z" fill="#000" opacity="0.12"/>
        <path d="M38,22 Q31,16 26,14 L26,20 Q32,20.5 38,22 Z" fill="#000" opacity="0.12"/>
        <path d="M20,4 L20,16" stroke="#fff" stroke-opacity="0.4" stroke-width="1.4" fill="none"/>
        <path d="M9,7 L14,18" stroke="#fff" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>
        <path d="M31,7 L26,18" stroke="#fff" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>
        <circle cx="20" cy="5.5" r="2" fill="currentColor" stroke="#fff" stroke-opacity="0.4" stroke-width="0.8"/>
        <line x1="6" y1="20" x2="16" y2="34" stroke="#5b4636" stroke-width="1"/>
        <line x1="34" y1="20" x2="24" y2="34" stroke="#5b4636" stroke-width="1"/>
        <line x1="14" y1="17" x2="17" y2="34" stroke="#5b4636" stroke-width="1"/>
        <line x1="26" y1="17" x2="23" y2="34" stroke="#5b4636" stroke-width="1"/>
      </g>
      <g class="person-group">
        <ellipse cx="20" cy="45" rx="5.5" ry="6.5" fill="#241a3d"/>
        <circle cx="20" cy="38" r="4.4" fill="#ffcfa0"/>
        <path d="M15.8,37 Q20,32 24.2,37 L24.2,38.5 Q20,35.5 15.8,38.5 Z" fill="#2b1b4d"/>
        <rect x="16" y="42" width="8" height="11" rx="4" fill="#2b1b4d"/>
        <line x1="16" y1="45" x2="11" y2="40" stroke="#2b1b4d" stroke-width="2" stroke-linecap="round"/>
        <line x1="24" y1="45" x2="29" y2="40" stroke="#2b1b4d" stroke-width="2" stroke-linecap="round"/>
        <line x1="17.5" y1="53" x2="15" y2="59" stroke="#17233a" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="22.5" y1="53" x2="25" y2="59" stroke="#17233a" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </svg>`;

  let round = 1;
  let pool = shuffle(names.slice());
  let finishedOrder = [];
  let racing = false;
  let raceTimer = null;

  const figEls = {};
  const jumperEls = {};
  const shadowEls = {};
  const progressState = {};
  const speedState = {};
  const landedFlags = {};

  function renderJumpers(){
    jumpersHost.innerHTML = SCENERY_HTML;
    for(const k in figEls) delete figEls[k];
    for(const k in jumperEls) delete jumperEls[k];
    for(const k in shadowEls) delete shadowEls[k];

    if(pool.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-sky';
      empty.textContent = 'Mọi người đã nhảy hết — chuẩn bị vòng mới...';
      jumpersHost.appendChild(empty);
      return;
    }

    pool.forEach((name, i) => {
      progressState[name] = 0;
      landedFlags[name] = false;

      const jumper = document.createElement('div');
      jumper.className = 'jumper';
      jumper.dataset.name = name;

      const shadow = document.createElement('div');
      shadow.className = 'jumper-shadow';

      const fig = document.createElement('div');
      fig.className = 'jumper-figure';
      fig.style.color = chuteColors[i % chuteColors.length];
      fig.innerHTML = PARACHUTE_SVG;

      const tag = document.createElement('span');
      tag.className = 'fail-tag';
      tag.textContent = '💀 ' + name;

      const crown = document.createElement('span');
      crown.className = 'crown-tag';
      crown.textContent = '👑';

      jumper.appendChild(shadow);
      jumper.appendChild(fig);
      jumper.appendChild(tag);
      jumper.appendChild(crown);
      jumpersHost.appendChild(jumper);

      figEls[name] = fig;
      jumperEls[name] = jumper;
      shadowEls[name] = shadow;
    });
  }
  renderJumpers();

  function updateProgress(){
    const done = names.length - pool.length;
    progressFill.style.width = (done / names.length * 100) + '%';
    progressLabel.textContent = `${done}/${names.length} đã nhảy · Vòng ${round}`;
  }
  updateProgress();

  function showRoundToast(){
    roundToast.textContent = `🪂 Cả 37 người đã nhảy xong — bắt đầu vòng ${round}!`;
    roundToast.classList.add('show');
    setTimeout(() => roundToast.classList.remove('show'), 2800);
  }

  function spawnDebris(){
    const colors = ['#ff5b5b','#ffd166','#ff9d3d','#ffffff','#c9c9c9'];
    for(let i = 0; i < 40; i++){
      const el = document.createElement('div');
      el.className = 'debris';
      el.style.left = (40 + Math.random() * 20) + '%';
      el.style.top = (10 + Math.random() * 15) + 'vh';
      const size = 5 + Math.random() * 6;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.setProperty('--drift', (Math.random() * 240 - 120) + 'px');
      el.style.setProperty('--spin', (Math.random() * 500 - 250) + 'deg');
      el.style.animationDelay = (Math.random() * 0.2) + 's';
      debrisHost.appendChild(el);
      setTimeout(() => el.remove(), 1600);
    }
  }

  function spawnLandingPuff(x, y){
    for(let i = 0; i < 7; i++){
      const el = document.createElement('div');
      el.className = 'puff';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      const ang = Math.random() * Math.PI - Math.PI / 2 - Math.PI / 2;
      const dist = 10 + Math.random() * 16;
      el.style.setProperty('--dx', (Math.cos(ang) * dist) + 'px');
      el.style.setProperty('--dy', (Math.sin(ang) * dist - 4) + 'px');
      debrisHost.appendChild(el);
      setTimeout(() => el.remove(), 550);
    }
  }

  function spawnConfetti(){
    const colors = ['#ff5b5b','#ffd166','#2fe0bc','#ff9d3d','#c99bff','#6b8cff'];
    for(let i = 0; i < 26; i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
      el.style.setProperty('--spin', (Math.random() * 700 - 350) + 'deg');
      el.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      debrisHost.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
  }

  finishedToggle.addEventListener('toggle', () => {
    let pop = document.getElementById('finishedPop');
    if(finishedToggle.open){
      if(!pop){
        pop = document.createElement('div');
        pop.id = 'finishedPop';
        pop.className = 'finished-pop';
        document.body.appendChild(pop);
      }
      const items = finishedOrder.length
        ? finishedOrder.map(n => `<div class="name-done">💀 ${n}</div>`).join('')
        : '<div style="opacity:.6;">Chưa có ai "dính" trong vòng này</div>';
      pop.innerHTML = `<strong>Vòng ${round} — thứ tự đã "dính"</strong><div class="pop-grid">${items}</div>`;
    } else if(pop){
      pop.remove();
    }
  });

  function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }

  function startDrop(){
    if(racing || pool.length === 0) return;
    racing = true;
    startBtn.disabled = true;
    startBtn.textContent = '🪂 Đang thả dù...';
    skyWrap.classList.add('cam-active');
    leaderChip.classList.remove('show', 'danger');
    let currentFocus = null;

    const skyHeight = sky.clientHeight;
    const travel = Math.max(40, skyHeight - 40);

    // chọn trước người xui của lượt này, nhưng thời điểm "gặp sự cố" là ngẫu nhiên,
    // không liên quan gì tới việc ai đáp đất trước
    const victim = pool[Math.floor(Math.random() * pool.length)];
    const failDelay = 900 + Math.random() * 1500;

    pool.forEach(name => {
      progressState[name] = 0;
      landedFlags[name] = false;
      speedState[name] = (100 / 2.3) * (0.85 + Math.random() * 0.3);
    });

    let startTs = null;
    let lastTs = null;
    let failed = false;
    let failTs = null;
    const landedSet = new Set();

    function frame(ts){
      if(!racing) return;
      if(startTs === null){ startTs = ts; lastTs = ts; }
      let dt = (ts - lastTs) / 1000;
      if(dt > 0.08) dt = 0.08;
      lastTs = ts;
      const elapsed = ts - startTs;

      if(!failed && elapsed >= failDelay){
        failed = true;
        failTs = ts;
        const alreadyLanded = progressState[victim] >= 99.5;
        const jEl = jumperEls[victim];
        if(jEl){
          if(alreadyLanded){
            jEl.classList.add('ground-fail');
          } else {
            jEl.classList.add('failing');
            speedState[victim] += 140;
          }
          const tag = jEl.querySelector('.fail-tag');
          if(tag) tag.classList.add('show');
        }
        skyWrap.classList.remove('shake');
        void skyWrap.offsetWidth;
        skyWrap.classList.add('shake');
        spawnDebris();
      }

      pool.forEach(name => {
        if(progressState[name] < 100){
          progressState[name] = Math.min(100, progressState[name] + speedState[name] * dt);
          const py = (progressState[name] / 100) * travel;
          const sway = Math.sin((ts / 260) + name.length) * 5;
          const fig = figEls[name];
          if(fig) fig.style.transform = `translate(calc(-50% + ${sway}px), ${py}px)`;

          const shadow = shadowEls[name];
          if(shadow){
            const p = progressState[name] / 100;
            shadow.style.opacity = (0.15 + p * 0.5).toFixed(2);
            shadow.style.transform = `translate(-50%, 0) scale(${(0.3 + p * 0.8).toFixed(2)})`;
          }

          if(progressState[name] >= 100 && !landedSet.has(name)){
            landedSet.add(name);
            if(name !== victim || !failed){
              const jEl = jumperEls[name];
              if(jEl){
                jEl.classList.add('landed');
                const rect = jEl.getBoundingClientRect();
                spawnLandingPuff(rect.left + rect.width / 2, rect.bottom - 6);
              }
            }
          }
        }
      });

      if(failed && (ts - failTs) > 550){
        racing = false;
        skyWrap.classList.remove('cam-active');
        finishDrop(victim);
        return;
      }

      // ---- camera: lia theo người đang dẫn đầu (hoặc nạn nhân khi có sự cố) ----
      let focusName = failed
        ? victim
        : pool.reduce((best, n) => progressState[n] > progressState[best] ? n : best, pool[0]);

      if(focusName !== currentFocus){
        if(currentFocus && jumperEls[currentFocus]) jumperEls[currentFocus].classList.remove('leading');
        if(!failed && jumperEls[focusName]) jumperEls[focusName].classList.add('leading');
        currentFocus = focusName;
        leaderName.textContent = focusName;
        leaderChip.classList.add('show');
        leaderChip.classList.toggle('danger', failed);
        leaderIco.textContent = failed ? '⚠️' : '🏆';
      }

      const focusEl = jumperEls[focusName];
      if(focusEl){
        const maxScroll = Math.max(0, jumpersHost.scrollWidth - sky.clientWidth);
        const targetScroll = clamp(focusEl.offsetLeft + focusEl.offsetWidth / 2 - sky.clientWidth / 2, 0, maxScroll);
        sky.scrollLeft += (targetScroll - sky.scrollLeft) * 0.08;
      }

      raceTimer = requestAnimationFrame(frame);
    }

    raceTimer = requestAnimationFrame(frame);
  }

  function finishDrop(victim){
    setTimeout(() => {
      pool = pool.filter(n => n !== victim);
      finishedOrder.push(victim);
      updateProgress();

      revealName.textContent = victim;
      revealRank.textContent = finishedOrder.length;
      revealRound.textContent = round;
      revealBanner.classList.add('show');
      spawnConfetti();
    }, 250);
  }

  nextBtn.addEventListener('click', () => {
    revealBanner.classList.remove('show');
    racing = false;
    startBtn.disabled = false;
    leaderChip.classList.remove('show', 'danger');
    skyWrap.classList.remove('cam-active');

    if(pool.length === 0){
      round++;
      pool = shuffle(names.slice());
      finishedOrder = [];
      showRoundToast();
      updateProgress();
    }
    renderJumpers();
    startBtn.textContent = '🪂 Thả dù!';
  });

  startBtn.addEventListener('click', startDrop);
</script>

</body>
</html>
