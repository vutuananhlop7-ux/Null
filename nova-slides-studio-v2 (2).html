<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Nova Slides Studio</title>
<style>
:root{--void:#05040F;--deep:#0A0721;--p1:#0d0a2b;--p2:#14103a;--line:rgba(120,110,255,.28);--star:#EAF0FF;--muted:#9BA1D4;--cyan:#26F0FF;--mag:#FF3DA5;--vio:#8A5BFF;--gold:#FFC94D;--ok:#3DDC84;--danger:#FF6B7A;
--ui:"Exo 2","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 80% -10%,#1b1050 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#2a0a45 0,transparent 55%),var(--void);color:var(--star);font:13.5px/1.45 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
*{scrollbar-width:thin;scrollbar-color:rgba(138,91,255,.6) transparent}
#top{height:52px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:rgba(10,7,33,.85);backdrop-filter:blur(8px);overflow-x:auto;white-space:nowrap}
.logo{font-weight:800;letter-spacing:.06em;font-size:16px;background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:10px}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px}
.b{border:1px solid var(--line);background:rgba(20,16,58,.7);padding:6px 11px;border-radius:2px 10px 2px 10px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.b:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(38,240,255,.3)}
.b:active{transform:scale(.96)}
.b.pri{background:linear-gradient(90deg,var(--cyan),var(--vio));color:#05040F;border-color:transparent;font-weight:700}
.b.hot{background:linear-gradient(90deg,var(--mag),var(--vio));border-color:transparent;font-weight:700}
.b.ic{padding:6px 9px;min-width:34px;justify-content:center;font-size:15px}
.b[disabled]{opacity:.4;pointer-events:none}
#app{display:grid;grid-template-columns:190px 1fr 330px;height:calc(100% - 52px)}
#thumbs{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(10,7,33,.55)}
#thumbList{flex:1;overflow:auto;padding:10px 10px 4px}
.th{position:relative;margin-bottom:10px;cursor:pointer}
.th .n{position:absolute;right:3px;top:3px;z-index:2;background:var(--p2);border:1px solid var(--line);font-size:11px;padding:0 6px;border-radius:8px}
.th .pic{width:166px;height:93.4px;overflow:hidden;border:1px solid var(--line);border-radius:3px 10px 3px 10px;position:relative;background:#000}
.th.on .pic{border-color:var(--cyan);box-shadow:0 0 14px rgba(38,240,255,.45)}
.th .pic>div{transform-origin:0 0;position:absolute;left:0;top:0;pointer-events:none}
.th .tags{position:absolute;right:4px;bottom:3px;z-index:2;display:flex;gap:3px}
.th .tags i{font-style:normal;font-size:10px;padding:0 5px;border-radius:6px;background:rgba(5,4,15,.8);border:1px solid var(--line)}
.th .tags i.m{color:var(--mag);border-color:var(--mag)}.th .tags i.a{color:var(--cyan);border-color:var(--cyan)}
.th .ops{position:absolute;left:4px;bottom:3px;z-index:2;display:none;gap:2px}
.th:hover .ops{display:flex}
.th .ops button{border:1px solid var(--line);background:rgba(5,4,15,.85);border-radius:5px;padding:0 5px;font-size:11px}
.th.over .pic{border-color:var(--mag)}
.tfoot{padding:8px 10px;border-top:1px solid var(--line);display:grid;gap:6px}
#work{display:flex;flex-direction:column;min-width:0;min-height:0}
#stageHost{flex:1;min-height:0;display:flex;overflow:auto;padding:18px}
#stageWrap{margin:auto}
#stageWrap{position:relative;flex:none;box-shadow:0 0 0 1px var(--line),0 0 50px rgba(138,91,255,.28)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#000;user-select:none;touch-action:none}
#status{height:30px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;color:var(--muted);font-size:12px;background:rgba(10,7,33,.55)}
#status .sp{flex:1}
#status input[type=range]{width:110px}
#side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(10,7,33,.7)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px}
.tab{border:1px solid var(--line);background:transparent;padding:6px 4px;font-weight:700;color:var(--muted);border-radius:2px 10px 2px 10px;font-size:12.5px}
.tab[aria-selected=true]{background:linear-gradient(90deg,var(--cyan),var(--vio));color:#05040F;border-color:transparent}
.pane{flex:1;overflow:auto;padding:4px 12px 20px;display:none}
.pane.on{display:block}
.grp{margin:10px 0 4px;color:var(--cyan);font-weight:700;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;min-width:0}
.f>span{font-size:11.5px;color:var(--muted)}
.f input[type=number],.f input[type=text],.f select,.f textarea{width:100%;background:rgba(5,4,15,.7);border:1px solid var(--line);border-radius:2px 8px 2px 8px;padding:5px 8px}
.f input[type=color]{width:100%;height:30px;padding:2px;background:rgba(5,4,15,.7);border:1px solid var(--line);border-radius:2px 8px 2px 8px}
.f input[type=range]{width:100%;accent-color:var(--cyan)}
.f.chk{flex-direction:row;align-items:center;gap:8px}
.hint{color:var(--muted);font-size:12px;border-left:2px solid var(--vio);padding:4px 8px;margin:8px 0;background:rgba(138,91,255,.08)}
.alist{display:flex;flex-direction:column;gap:5px}
.arow{display:grid;grid-template-columns:22px 18px 1fr auto;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:2px 10px 2px 10px;background:rgba(20,16,58,.5);cursor:pointer}
.arow.on{border-color:var(--cyan);box-shadow:0 0 12px rgba(38,240,255,.25)}
.arow .dot{width:10px;height:10px;border-radius:50%}
.arow small{color:var(--muted)}
.arow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}
.menu button{border:1px solid var(--line);background:rgba(20,16,58,.6);border-radius:2px 8px 2px 8px;padding:5px 6px;text-align:left;font-size:12.5px}
.menu button:hover{border-color:var(--mag)}
.menu h4{grid-column:1/-1;margin:6px 0 0;font-size:11.5px;color:var(--gold)}
.tl{margin-top:8px;border:1px solid var(--line);border-radius:3px 10px 3px 10px;padding:8px;background:rgba(5,4,15,.6)}
.tl .r{position:relative;height:16px;margin:3px 0}
.tl .bar{position:absolute;top:2px;height:12px;border-radius:6px;opacity:.9;min-width:4px}
.tl .ck{position:absolute;top:0;bottom:0;width:1px;background:var(--gold);opacity:.6}
.tl .lb{position:absolute;left:4px;top:-1px;font-size:10px;color:#fff;text-shadow:0 0 3px #000;white-space:nowrap;pointer-events:none}
/* slide elements */
.el{position:absolute;transform-origin:50% 50%}
.el svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.el img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;object-fit:fill}
.el video.vid,.el canvas.m3d{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;background:#000;border:0}
.el canvas.m3d{background:transparent;touch-action:none;cursor:grab}
#pStage .el video.vid,#pStage .el canvas.m3d{pointer-events:auto}
.mbadge{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(10,7,33,.72);border:2px solid var(--cyan);color:var(--cyan);display:flex;align-items:center;justify-content:center;font:700 22px sans-serif;pointer-events:none;box-shadow:0 0 18px rgba(38,240,255,.5)}
.mbadge.m3{left:auto;top:auto;right:8px;bottom:8px;margin:0;width:auto;height:auto;border-radius:8px;padding:3px 8px;font-size:14px;border-width:1px}
#mvCanvas{width:100%;height:190px;border-radius:10px;background:#0b0824;border:1px solid var(--line,#2a2160);touch-action:none;cursor:grab;display:block}
.el .txt{position:absolute;inset:0;display:flex;flex-direction:column;padding:4.8px 9.6px;line-height:1.2;white-space:pre-wrap;word-break:break-word;overflow:visible;pointer-events:none;outline:none}
.el.line{pointer-events:none}
.bgl{position:absolute;inset:0}
.edit .el{cursor:move}
.edit .el .txt.ed{pointer-events:auto;cursor:text;outline:1px dashed var(--cyan);background:rgba(0,0,0,.25)}
#ov{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
.sel{position:absolute;border:1.5px solid var(--cyan);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.hd{position:absolute;background:#fff;border:1.5px solid var(--cyan);pointer-events:auto;border-radius:2px}
.hd.rot{border-radius:50%;background:var(--mag);border-color:#fff;cursor:grab}
.gd{position:absolute;background:var(--mag);pointer-events:none}
/* presenter */
#pres{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center;overflow:hidden}
#pres.on{display:flex}
#pStage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}
#pHud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;justify-content:space-between;padding:10px 60px 10px 14px;opacity:0;transition:.3s;z-index:3}
#pres:hover #pHud{opacity:1}
#pHud span{background:rgba(5,4,15,.8);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:rgba(10,7,33,.95);border:1px solid var(--cyan);border-radius:3px 12px 3px 12px;padding:8px 16px;z-index:200;display:none;box-shadow:0 0 20px rgba(38,240,255,.35);max-width:80vw}

#notesBar{border-top:1px solid var(--line);background:rgba(10,7,33,.6);padding:6px 12px;display:flex;gap:10px;align-items:stretch}
#notesBar label{color:var(--muted);font-size:11.5px;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.08em;text-transform:uppercase}
#notes{flex:1;height:58px;resize:vertical;min-height:40px;max-height:160px;background:rgba(5,4,15,.7);border:1px solid var(--line);border-radius:2px 10px 2px 10px;padding:6px 10px}
.gridl{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:20px 20px}
.mq{position:absolute;border:1px dashed var(--cyan);background:rgba(38,240,255,.08);pointer-events:none}
.sel.m{border-style:solid;border-color:var(--mag);opacity:.9}
.sel.g{border-style:dashed;border-color:var(--cyan)}
#pop{position:fixed;z-index:60;background:rgba(10,7,33,.97);border:1px solid var(--cyan);border-radius:3px 14px 3px 14px;padding:10px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 24px rgba(38,240,255,.2);display:none;max-width:420px}
#pop.on{display:block}
#pop .g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#pop button.sh{border:1px solid var(--line);background:rgba(20,16,58,.6);border-radius:2px 8px 2px 8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted)}
#pop button.sh:hover{border-color:var(--mag);color:var(--star)}
#pop button.sh svg{width:34px;height:26px;overflow:visible}
#pop .lay{display:grid;grid-template-columns:repeat(2,170px);gap:8px}
#pop .lay button{border:1px solid var(--line);background:rgba(20,16,58,.6);border-radius:2px 8px 2px 8px;padding:6px;text-align:left;font-size:12px}
#pop .lay button:hover{border-color:var(--mag)}
#pop .lay svg{width:100%;height:60px;display:block;margin-bottom:4px;background:#05040F;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{border:1px solid var(--line);border-radius:2px 8px 2px 8px;padding:4px 9px;background:rgba(20,16,58,.6);font-size:12px}
.chips button:hover{border-color:var(--mag)}
.chips .bgc{width:34px;height:22px;padding:0;border-radius:4px}
.alg{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:8px}
.alg button{border:1px solid var(--line);background:rgba(20,16,58,.6);border-radius:2px 8px 2px 8px;padding:5px 0;font-size:14px}
.alg button:hover{border-color:var(--cyan)}
#hPanel{position:fixed;right:14px;bottom:14px;width:256px;z-index:7;background:rgba(5,4,15,.88);border:1px solid var(--cyan);border-radius:12px;padding:6px;display:none;box-shadow:0 0 24px rgba(38,240,255,.25);opacity:.92}
#hPanel:hover{opacity:1}
#hCv{width:100%;border-radius:8px;display:block;transform:scaleX(-1);background:#000}
#hSt{font:600 12px sans-serif;color:var(--cyan);margin:6px 2px 2px;min-height:16px}
#hHelp{font:11px/1.4 sans-serif;color:var(--muted);margin:2px}
#hCur{position:fixed;left:0;top:0;width:0;height:0;display:none;z-index:8;pointer-events:none}
#hCur i{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:3px solid #26F0FF;background:radial-gradient(circle,#fff 0,rgba(38,240,255,.35) 40%,rgba(38,240,255,0) 70%);box-shadow:0 0 18px #26F0FF;transition:transform .08s,border-color .08s}
#hCur.pinch i{transform:scale(.55);border-color:#FF3DA5;box-shadow:0 0 22px #FF3DA5}
#hCur2{position:fixed;left:0;top:0;width:0;height:0;display:none;z-index:8;pointer-events:none}
#hCur2 i{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:3px solid #FF3DA5;background:radial-gradient(circle,#fff 0,rgba(255,61,165,.35) 40%,rgba(255,61,165,0) 70%);box-shadow:0 0 22px #FF3DA5;transform:scale(.55)}
#hLine{position:fixed;left:0;top:0;height:3px;margin-top:-1.5px;transform-origin:0 50%;display:none;z-index:8;pointer-events:none;background:linear-gradient(90deg,#26F0FF,#FF3DA5);box-shadow:0 0 14px #26F0FF}
#hFlash{position:fixed;left:50%;top:9%;transform:translateX(-50%);z-index:9;background:rgba(5,4,15,.85);border:1px solid var(--cyan);color:#fff;border-radius:999px;padding:8px 20px;font:700 18px sans-serif;opacity:0;pointer-events:none}
#hFlash.on{animation:hf 1.1s ease-out}
@keyframes hf{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%)}75%{opacity:1}100%{opacity:0}}
#pStage .el.hhov{outline:2px dashed #26F0FF;outline-offset:4px}
#pPen{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#pChip{position:fixed;display:none;z-index:5;align-items:center;gap:6px;background:rgba(5,4,15,.9);color:#fff;border:1px solid var(--cyan);border-radius:999px;padding:6px 12px;font:600 13px sans-serif;cursor:pointer;box-shadow:0 0 14px rgba(38,240,255,.4)}
#pChip:hover{background:var(--cyan);color:#05040F}
#pStage .el.psel{outline:2px dashed rgba(38,240,255,.85);outline-offset:4px}
#pFocus{position:fixed;inset:0;z-index:5;display:none;background:rgba(2,2,10,.86);backdrop-filter:blur(8px);touch-action:none;overflow:hidden}
#pFocus.on{display:block;animation:fin .2s ease-out}
@keyframes fin{from{opacity:0}to{opacity:1}}
#pFocus .fstage{position:absolute;inset:0;cursor:grab}
#pFocus .fw{position:absolute;transform-origin:50% 50%;will-change:transform}
#pFocus .fw .el{position:absolute}
#pFocus .fbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(10,7,33,.92);border:1px solid var(--cyan);border-radius:14px;padding:8px 12px;box-shadow:0 0 28px rgba(38,240,255,.3);user-select:none}
#pFocus .fbar button{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line,#2a2160);background:#14103a;color:#fff;font:700 20px sans-serif;cursor:pointer}
#pFocus .fbar button:hover{background:var(--cyan);color:#05040F}
#pFocus .fbar button.x{background:#3a0f2a}
#pFocus .fbar i{width:1px;height:28px;background:var(--line,#2a2160);margin:0 4px}
#pFocus .flab{font:600 12px sans-serif;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:6px}
#pFocus .fz{font:600 13px sans-serif;color:var(--cyan);min-width:46px;text-align:center}
#pFocus .fbar button.hdw{background:var(--cyan);color:#05040F;box-shadow:0 0 16px var(--cyan)}
#hCur i{--p:0deg}
#hCur.dwell i{background:conic-gradient(#26F0FF var(--p),rgba(38,240,255,.12) 0)}
#pres.holo{background:radial-gradient(ellipse at 50% 38%,#0d3347 0,#03101a 58%,#000 100%)}
#pres.holo #pStage{overflow:visible}
#holoFx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#holoGrid{position:fixed;left:-40%;right:-40%;bottom:0;height:52vh;pointer-events:none;background-image:linear-gradient(rgba(38,240,255,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(38,240,255,.32) 1px,transparent 1px);background-size:90px 90px;transform:perspective(520px) rotateX(72deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 0,transparent 92%);mask-image:linear-gradient(to top,#000 0,transparent 92%);animation:hgrid 2.6s linear infinite;opacity:.7}
@keyframes hgrid{from{background-position:0 0,0 0}to{background-position:0 90px,0 0}}
#holoScan{position:fixed;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,rgba(38,240,255,.045) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
#holoScan::after{content:'';position:absolute;left:0;right:0;height:18vh;top:-18vh;background:linear-gradient(180deg,transparent,rgba(38,240,255,.10),transparent);animation:hscan 5.5s linear infinite}
@keyframes hscan{to{top:100vh}}
#holoTag{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;font:700 11px/1 monospace;letter-spacing:.35em;color:rgba(38,240,255,.7);pointer-events:none}
#laser{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ff2a4d 35%,rgba(255,42,77,0) 70%);pointer-events:none;z-index:5;display:none;box-shadow:0 0 18px #ff2a4d}
#pNotes{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(860px,92vw);max-height:30vh;overflow:auto;background:rgba(5,4,15,.92);border:1px solid var(--cyan);border-radius:3px 14px 3px 14px;padding:10px 16px;font-size:17px;line-height:1.5;z-index:4;display:none;white-space:pre-wrap}
#pExit{position:fixed;right:12px;top:12px;z-index:9;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(5,4,15,.55);color:#fff;font:700 18px sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.35;transition:.25s}
#pExit:hover,#pres.ui #pExit{opacity:1}#pExit:hover{background:#c2185b;border-color:#fff}
#pNav{position:fixed;left:12px;bottom:12px;z-index:9;display:flex;align-items:center;gap:2px;background:rgba(5,4,15,.6);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 6px;opacity:.3;transition:.25s;user-select:none}
#pNav:hover,#pres.ui #pNav{opacity:1}
#pNav button{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:#fff;font:700 13px sans-serif;cursor:pointer}
#pNav button:hover{background:var(--cyan);color:#05040F}
#pRec.on{background:#c2185b;color:#fff;width:auto;border-radius:999px;padding:0 10px;animation:recb 1.2s infinite}@keyframes recb{50%{opacity:.55}}
#pNum{font:600 12px sans-serif;color:#fff;min-width:54px;text-align:center}
#pBar{position:fixed;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--mag));z-index:4;transition:width .3s}
#pBlack{position:fixed;inset:0;background:#000;z-index:6;display:none}
@media (max-width:1000px){#app{grid-template-columns:120px 1fr 280px}.th .pic{width:100px;height:56px}}
/* ================= Điện thoại / cảm ứng ================= */
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{touch-action:none}
#pres{touch-action:none}
#tabNotesM,#sheetHd,#mBar{display:none}
#stInfo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (pointer:coarse){

const xe=s=>esc(String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,''));
const hex6=c=>String(c||'#000000').replace('#','').toUpperCase().padEnd(6,'0').slice(0,6);
const FONTS=['Arial','Segoe UI','Calibri','Georgia','Times New Roman','Courier New','Consolas','Impact','Verdana','Tahoma','Trebuchet MS'];
const SHAPES={rect:'Chữ nhật',round:'Bo góc',ellipse:'Elip',triangle:'Tam giác',diamond:'Hình thoi',hexagon:'Lục giác',star:'Sao 5 cánh',arrow:'Mũi tên',heart:'Trái tim',chevron:'Chevron',parallelogram:'Bình hành',trapezoid:'Hình thang',pentagon:'Ngũ giác',octagon:'Bát giác',cross:'Dấu cộng',donut:'Vòng khuyên',bubble:'Bong bóng thoại',line:'Đường thẳng',text:'Văn bản',image:'Hình ảnh',video:'Video',model3d:'Mô hình 3D'};
const PRST={rect:'rect',round:'roundRect',ellipse:'ellipse',triangle:'triangle',diamond:'diamond',hexagon:'hexagon',star:'star5',arrow:'rightArrow',heart:'heart',chevron:'chevron',parallelogram:'parallelogram',trapezoid:'trapezoid',pentagon:'pentagon',octagon:'octagon',cross:'plus',donut:'donut',bubble:'wedgeRoundRectCallout',line:'line',text:'rect',image:'rect',video:'rect',model3d:'rect'};

function uniqueKey(sl,base){let k=base,i=1;const has=x=>sl.els.some(e=>e.key===x);while(has(k))k=base+'_'+(++i);return k}
function newEl(type,o={}){
  const b={id:uid(),key:'',type,x:490,y:260,w:300,h:200,rot:0,fillMode:'solid',fill:'#26F0FF',fill2:'#8A5BFF',gradAng:90,fillOp:1,stroke:'#FFFFFF',sw:0,strokeOp:1,glow:0,glowColor:'#26F0FF',shadow:false,text:'',fs:32,color:'#FFFFFF',bold:false,italic:false,u:false,ls:1,sp:0,align:'ctr',valign:'ctr',font:'Arial'};

  if(['ellipse','star','heart','hexagon','diamond','triangle','pentagon','octagon','cross','donut'].includes(type))Object.assign(b,{w:220,h:220,x:530,y:250});
  return Object.assign(b,o);
}
function newSlide(){return{id:uid(),bg:{mode:'grad',c1:'#0A0721',c2:'#1d0b45',ang:135},els:[],anims:[],tr:{type:'none',dir:'l',dur:700,morph:'byObject',click:true,auto:0},notes:''}}
const isPic=e=>e.type==='image'||e.type==='video'||e.type==='model3d';
const isTextCap=e=>e.type!=='line'&&!isPic(e);

/* ================= Hình học (xem trước SVG ↔ prstGeom) ================= */
function geom(t,w,h){
  const f=n=>+n.toFixed(2);
  switch(t){
    case 'round':{const r=Math.min(w,h)*0.16667;return`M${f(r)} 0H${f(w-r)}A${f(r)} ${f(r)} 0 0 1 ${f(w)} ${f(r)}V${f(h-r)}A${f(r)} ${f(r)} 0 0 1 ${f(w-r)} ${f(h)}H${f(r)}A${f(r)} ${f(r)} 0 0 1 0 ${f(h-r)}V${f(r)}A${f(r)} ${f(r)} 0 0 1 ${f(r)} 0Z`}
    case 'ellipse':return`M0 ${f(h/2)}A${f(w/2)} ${f(h/2)} 0 1 1 ${f(w)} ${f(h/2)}A${f(w/2)} ${f(h/2)} 0 1 1 0 ${f(h/2)}Z`;
    case 'triangle':return`M${f(w/2)} 0L${f(w)} ${f(h)}L0 ${f(h)}Z`;
    case 'diamond':return`M${f(w/2)} 0L${f(w)} ${f(h/2)}L${f(w/2)} ${f(h)}L0 ${f(h/2)}Z`;
    case 'hexagon':{const x=Math.min(w,h)*0.25*1.1547/1.1547;return`M0 ${f(h/2)}L${f(x)} 0L${f(w-x)} 0L${f(w)} ${f(h/2)}L${f(w-x)} ${f(h)}L${f(x)} ${f(h)}Z`}
    case 'star':{let d='';for(let i=0;i<10;i++){const r=i%2?0.382:1,a=(-90+36*i)*Math.PI/180;const x=(Math.cos(a)*r+0.951)/1.902*w,y=(Math.sin(a)*r+1)/1.809*h;d+=(i?'L':'M')+f(x)+' '+f(y)}return d+'Z'}
    case 'arrow':{const hl=Math.min(w,h)*0.5;return`M0 ${f(h*.25)}L${f(w-hl)} ${f(h*.25)}L${f(w-hl)} 0L${f(w)} ${f(h/2)}L${f(w-hl)} ${f(h)}L${f(w-hl)} ${f(h*.75)}L0 ${f(h*.75)}Z`}
    case 'heart':{const X=v=>f(v/100*w),Y=v=>f(v/100*h);return`M${X(50)} ${Y(96)}C${X(8)} ${Y(62)} ${X(-6)} ${Y(30)} ${X(22)} ${Y(10)}C${X(38)} ${Y(-1)} ${X(50)} ${Y(14)} ${X(50)} ${Y(24)}C${X(50)} ${Y(14)} ${X(62)} ${Y(-1)} ${X(78)} ${Y(10)}C${X(106)} ${Y(30)} ${X(92)} ${Y(62)} ${X(50)} ${Y(96)}Z`}
    case 'chevron':{const x=Math.min(w,h)*0.5;return`M0 0L${f(w-x)} 0L${f(w)} ${f(h/2)}L${f(w-x)} ${f(h)}L0 ${f(h)}L${f(x)} ${f(h/2)}Z`}
    case 'parallelogram':{const x=Math.min(w,h)*0.25;return`M${f(x)} 0L${f(w)} 0L${f(w-x)} ${f(h)}L0 ${f(h)}Z`}
    case 'trapezoid':{const x=Math.min(w,h)*0.25;return`M0 ${f(h)}L${f(x)} 0L${f(w-x)} 0L${f(w)} ${f(h)}Z`}
    case 'pentagon':return`M${f(w*.5)} 0L${f(w)} ${f(h*.3819)}L${f(w*.809)} ${f(h)}L${f(w*.191)} ${f(h)}L0 ${f(h*.3819)}Z`;

addEventListener('keydown',ev=>{

  const tg=ev.target,typing=tg.matches&&tg.matches('input,textarea,select,[contenteditable="true"]');
  if(drawPath){if(ev.key==='Enter'){finishPath()}else if(ev.key==='Escape'){drawPath=null;drawSel()}return}
  const mod=ev.ctrlKey||ev.metaKey;
  if(mod&&ev.key.toLowerCase()==='z'&&!typing){ev.preventDefault();ev.shiftKey?redo():undo();return}
  if(mod&&ev.key.toLowerCase()==='y'&&!typing){ev.preventDefault();redo();return}
  if(mod&&ev.key.toLowerCase()==='s'){ev.preventDefault();$('#bSave').click();return}
  if(ev.key==='F5'){ev.preventDefault();presOpen(cur);return}
  if(typing)return;

  if(mod&&ev.key.toLowerCase()==='d'){ev.preventDefault();dupEl();return}
  if(mod&&ev.key.toLowerCase()==='g'&&e){ev.preventDefault();alignOp(ev.shiftKey?'ungrp':'grp');return}
  if(mod&&ev.key.toLowerCase()==='c'&&e){clip=JSON.parse(JSON.stringify(selEls()));return}
  if(mod&&ev.key.toLowerCase()==='a'){ev.preventDefault();setMulti(S().els.map(x=>x.id));drawSel();renderPanels();return}

function flatNormals(pos,idx){ // bỏ chỉ mục, tính pháp tuyến mặt

function finishModel(meshes,name){

/* ================= Điều khiển bằng cử chỉ tay (webcam) ================= */
/* Lớp 1: bộ nhận dạng cử chỉ thuần túy (không phụ thuộc camera) — nhận 21 điểm mốc bàn tay, phát sự kiện */
const HG={
  TIPS:[8,12,16,20],PIPS:[6,10,14,18],
  ACT:{x0:.18,x1:.82,y0:.14,y1:.78},           // vùng camera dùng để phủ toàn màn hình
  PINCH_ON:.30,PINCH_OFF:.46,TAP_MS:420,TAP_MOVE:.05,
  SWIPE_WIN:380,SWIPE_DX:.26,SWIPE_CD:1000,FIST_MS:800
};
class OneEuro{
  constructor(minC=1.4,beta=.03,dC=1){this.minC=minC;this.beta=beta;this.dC=dC;this.x=null;this.dx=0;this.t=null}
  a(cut,dt){const r=2*Math.PI*cut*dt;return r/(r+1)}
  f(v,t){if(this.x===null){this.x=v;this.t=t;return v}const dt=Math.max(.001,(t-this.t)/1000);this.t=t;
    const dx=(v-this.x)/dt;this.dx+=this.a(this.dC,dt)*(dx-this.dx);const cut=this.minC+this.beta*Math.abs(this.dx);this.x+=this.a(cut,dt)*(v-this.x);return this.x}

class GestureEngine{
  constructor(on,aspect=4/3){this.on=on||(()=>{});this.asp=aspect;this.fx=new OneEuro();this.fy=new OneEuro();this.reset()}
  reset(){this.pinch=false;this.pose='none';this.cand='none';this.candN=0;this.hist=[];this.fistT=0;this.fistDone=false;this.lastSwipe=-1e9;this.pStart=null;this.drag=false;this.last=null;this.vis=false;this.fx.reset();this.fy.reset();this.t2={a:false,b:false,on:false,n:0,f:[new OneEuro(),new OneEuro(),new OneEuro(),new OneEuro()],d:0,ang:0,cx:0,cy:0}}
  d(a,b){const dx=(a.x-b.x)*this.asp,dy=a.y-b.y;return Math.hypot(dx,dy)}
  classify(lm,was=this.pinch){
    const w=lm[0],size=Math.max(this.d(w,lm[9]),this.d(lm[5],lm[17]),1e-4);
    const ext=HG.TIPS.map((t,i)=>this.d(lm[t],w)>this.d(lm[HG.PIPS[i]],w)*1.1);
    const n=ext.filter(Boolean).length;
    const pr=this.d(lm[4],lm[8])/size;
    let pinch=was?pr<HG.PINCH_OFF:pr<HG.PINCH_ON;
    let pose='other';
    if(pinch)pose='pinch';

    else if(n===0)pose='fist';

  /* lm: mảng 21 điểm {x,y} đã chuẩn hóa [0..1] theo ảnh camera (chưa lật gương) */
  mapPt(p){const A=HG.ACT;return{x:Math.max(0,Math.min(1,((1-p.x)-A.x0)/(A.x1-A.x0))),y:Math.max(0,Math.min(1,(p.y-A.y0)/(A.y1-A.y0)))}}

  two(l1,l2,t){
    const T=this.t2,W=(this.scr&&this.scr[0])||1280,H=(this.scr&&this.scr[1])||720;
    if(this.vis||this.drag||this.pStart){if(this.drag)this.on({type:'dragEnd'});this.pStart=null;this.drag=false;this.vis=false;this.pose='none';this.hist=[];this.fistT=0;this.on({type:'lost'});this.fx.reset();this.fy.reset()}
    const ca=this.classify(l1,T.a),cb=this.classify(l2,T.b);T.a=ca.pinch;T.b=cb.pinch;
    const pa=this.mapPt({x:(l1[4].x+l1[8].x)/2,y:(l1[4].y+l1[8].y)/2}),pb=this.mapPt({x:(l2[4].x+l2[8].x)/2,y:(l2[4].y+l2[8].y)/2});

    T.n++;
    if(!T.on&&T.n<2){T.f[0].f(A.x,t);T.f[1].f(A.y,t);T.f[2].f(B.x,t);T.f[3].f(B.y,t);return}
    const ax=T.f[0].f(A.x,t),ay=T.f[1].f(A.y,t),bx=T.f[2].f(B.x,t),by=T.f[3].f(B.y,t);

    if(!T.on){T.on=true;T.d=d;T.ang=ang;T.cx=cx;T.cy=cy;this.on({type:'twoStart',ax,ay,bx,by,cx,cy,d,ang});return}

  twoEnd(){const T=this.t2;if(T.on){T.on=false;this.on({type:'twoEnd'})}T.n=0;T.a=T.b=false}
  update(lm,t){
    if(this.t2&&(this.t2.on||this.t2.n))this.twoEnd();

    const pose=this.pose;

    const px=pose==='pinch'?(lm[4].x+lm[8].x)/2:lm[8].x,py=pose==='pinch'?(lm[4].y+lm[8].y)/2:lm[8].y;
    const A=HG.ACT,nx=Math.max(0,Math.min(1,((1-px)-A.x0)/(A.x1-A.x0))),ny=Math.max(0,Math.min(1,(py-A.y0)/(A.y1-A.y0)));

    const sx=this.fx.f(nx,t),sy=this.fy.f(ny,t);

    if(pose==='pinch'&&prev!=='pinch'){this.pStart={t,x:sx,y:sy};this.drag=false;this.on({type:'pinchStart',x:sx,y:sy})}
    if(pose==='pinch'&&this.pStart){
      const mv=Math.hypot(sx-this.pStart.x,sy-this.pStart.y);
      if(!this.drag&&(mv>HG.TAP_MOVE||t-this.pStart.t>HG.TAP_MS)){this.drag=true;this.dragLast={x:sx,y:sy};this.on({type:'dragStart',x:sx,y:sy})}

    }
    if(pose!=='pinch'&&prev==='pinch'&&this.pStart){
      if(this.drag)this.on({type:'dragEnd'});else if(t-this.pStart.t<=HG.TAP_MS)this.on({type:'tap',x:this.pStart.x,y:this.pStart.y});

    }
    // vuốt: bàn tay mở di chuyển ngang nhanh

  }
  lost(t){

async function importPptx(file){
  toast('Đang nhập PowerPoint…',4000);
  try{
    const buf=await file.arrayBuffer();
    const r=await PI.import(buf,(i,n)=>{if(n>6)toast(`Đang nhập slide ${i}/${n}…`,1500)});
    Object.keys(MODELS).forEach(k=>delete MODELS[k]);
    const keepM={};Object.keys(MEDIA).forEach(k=>{if(r.slides.some(s=>s.els.some(e=>e.media===k)))keepM[k]=MEDIA[k]});Object.keys(MEDIA).forEach(k=>{if(!keepM[k])delete MEDIA[k]});
    const assets={};r.slides.forEach(s=>s.els.forEach(e=>{if(e.img&&ASSETS[e.img])assets[e.img]=ASSETS[e.img]}));
    setDeck({slides:r.slides},assets);
    const sk=Object.entries(r.rep.skipped).map(([k,v])=>`${v} ${k}`).join(', ');
    toast(`Đã nhập ${r.rep.slides} slide · ${r.rep.anims} hoạt ảnh${r.rep.morph?` · ${r.rep.morph} Morph`:''}${r.rep.notes?` · ${r.rep.notes} ghi chú`:''}${r.rep.media?` · ${r.rep.media} video`:''}${r.rep.tables?` · ${r.rep.tables} bảng`:''}${r.rep.charts?` · ${r.rep.charts} biểu đồ`:''}.${sk?' Chưa nhập được: '+sk+'.':''}`,sk?9000:5000);
    return r;
  }catch(err){console.error(err);toast('Không nhập được .pptx: '+err.message,7000)}
}

AI.color=(v,rep,path,def)=>{

AI.num=(v,rep,path,def,ax)=>{

};

AI.compileEl=async function(se,ctx,path,sl,E){

  let w=g('w',type==='line'?300:type==='text'?460:type==='image'?400:220,'w'),h=g('h',type==='line'?0:type==='text'?80:type==='image'?300:220,'h');

    if(fl==='none'||fl===false)it.fillMode='none';
    else if(Array.isArray(fl)){it.fillMode='grad';it.fill=AI.color(fl[0],rep,path+'.fill[0]','#26F0FF');it.fill2=AI.color(fl[1],rep,path+'.fill[1]','#8A5BFF');it.gradAng=+fl[2]||90}
    else if(typeof fl==='string'){it.fillMode='solid';it.fill=AI.color(fl,rep,path+'.fill','#26F0FF')}
    if(type==='text'&&fl==null)it.fillMode='none';
    if(type!=='image'&&se.opacity!=null)it.fillOp=Math.max(0,Math.min(1,+se.opacity))
  }

  }

};
AI.loadImage=function(src,w,h){

  types:{bar:'Cột đứng',hbar:'Cột ngang',line:'Đường',pie:'Tròn',donut:'Vành khuyên'},
  sample:'Nhãn,Doanh thu,Lợi nhuận\nQ1,120,40\nQ2,180,65\nQ3,150,52\nQ4,240,98',
  samplePie:'Nhãn,Tỉ lệ\nSản phẩm A,45\nSản phẩm B,30\nSản phẩm C,15\nKhác,10',
  parse(csv){
    const rows=String(csv||'').split(/\r?\n/).map(r=>r.split(/[,;\t]/).map(x=>x.trim())).filter(r=>r.some(x=>x!==''));
    if(!rows.length)return{labels:[],series:[]};
    const head=rows[0],ns=Math.max(1,head.length-1),series=[];
    for(let i=1;i<=ns;i++)series.push({name:head[i]||('Chuỗi '+i),values:[]});
    const labels=[];
    rows.slice(1).forEach(r=>{labels.push(r[0]||'');for(let i=1;i<=ns;i++){const v=parseFloat(r[i]);series[i-1].values.push(isNaN(v)?0:v)}});
    return{labels,series};
  }
};

function slideToCanvas(sl,sc){
  return new Promise((ok,no)=>{
    const r=buildSlide(sl);$$('.mbadge',r).forEach(b=>b.remove());
    const host=document.createElement('div');host.style.cssText='position:relative;width:1280px;height:720px;overflow:hidden;background:#000';
    const st=document.createElement('style');st.textContent=EXPCSS;host.appendChild(st);host.appendChild(r);
    const xml=new XMLSerializer().serializeToString(host);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><foreignObject x="0" y="0" width="1280" height="720">'+xml+'</foreignObject></svg>';
    const im=new Image();
    im.onload=()=>{try{const cv=document.createElement('canvas');cv.width=Math.round(1280*sc);cv.height=Math.round(720*sc);const g=cv.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);g.scale(sc,sc);g.drawImage(im,0,0);ok(cv)}catch(e){no(e)}};

function makePdf(pages,W,H){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length};
  const obj=(i,fn)=>{offs[i]=len;push(i+' 0 obj\n');fn();push('\nendobj\n')};
  const n=pages.length;push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>'));
  pages.forEach((j,i)=>{const pg=3+3*i,ct=pg+1,im=pg+2,cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
    obj(pg,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>'));
    obj(ct,()=>push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(im,()=>{push('<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.bytes.length+' >>\nstream\n');push(j.bytes);push('\nendstream')})});
  const xr=len,tot=3+3*n;push('xref\n0 '+tot+'\n0000000000 65535 f \n');
  for(let i=1;i<tot;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  const out=new Uint8Array(len);let p0=0;chunks.forEach(c=>{out.set(c,p0);p0+=c.length});return out;
}

/* dò đường viền từ mặt nạ nhị phân → các vòng đa giác (toạ độ lưới) */
function traceMask(m,W,H){
  const V=W+1,n=V*(H+1),o1=new Int8Array(n).fill(-1),o2=new Int8Array(n).fill(-1),starts=[];
  const add=(x,y,d)=>{const k=y*V+x;if(o1[k]<0)o1[k]=d;else o2[k]=d;starts.push(k)};
  for(let y=0;y<H;y++){const r=y*W;for(let x=0;x<W;x++){if(!m[r+x])continue;
    if(y===0||!m[r-W+x])add(x,y,0);
    if(x===W-1||!m[r+x+1])add(x+1,y,1);
    if(y===H-1||!m[r+W+x])add(x+1,y+1,2);
    if(x===0||!m[r+x-1])add(x,y+1,3)}}
  const DX=[1,0,-1,0],DY=[0,1,0,-1];
  const pick=(k,inc)=>{const a=o1[k],b=o2[k];if(a<0)return-1;
    if(b<0||inc<0){o1[k]=b;o2[k]=-1;return a}
    if((b-inc+4)%4===1){o1[k]=a;o2[k]=-1;return b}
    o1[k]=b;o2[k]=-1;return a};
  const loops=[];
  for(const s of starts){
    while(o1[s]>=0){
      let k=s,inc=-1,d=pick(k,-1);const xs=[],ys=[];
      let guard=0;
      do{xs.push(k%V);ys.push((k/V)|0);k+=DX[d]+DY[d]*V;inc=d;d=pick(k,inc);guard++}while(k!==s&&d>=0&&guard<8e6);
      /* bỏ các điểm thẳng hàng */
      const P=[],L=xs.length;
      for(let i=0;i<L;i++){const a=(i+L-1)%L,b=(i+1)%L;
        if((xs[i]-xs[a])*(ys[b]-ys[i])-(ys[i]-ys[a])*(xs[b]-xs[i])!==0)P.push([xs[i],ys[i]])}
      if(P.length>=3)loops.push(P);
    }
  }
  return loops;
}
function dpKeep(P,eps){
  const n=P.length,keep=new Uint8Array(n);keep[0]=keep[n-1]=1;const st=[[0,n-1]];
  while(st.length){const[a,b]=st.pop();let md=0,mi=-1;const ax=P[a][0],ay=P[a][1],dx=P[b][0]-ax,dy=P[b][1]-ay,L=Math.hypot(dx,dy)||1e-9;
    for(let i=a+1;i<b;i++){const d=Math.abs((P[i][0]-ax)*dy-(P[i][1]-ay)*dx)/L;if(d>md){md=d;mi=i}}
    if(md>eps&&mi>0){keep[mi]=1;st.push([a,mi],[mi,b])}}
  return P.filter((_,i)=>keep[i]);
}
function simplifyLoop(P,eps){
  if(P.length<=6)return P;
  let fi=1,fd=-1;for(let i=1;i<P.length;i++){const d=(P[i][0]-P[0][0])**2+(P[i][1]-P[0][1])**2;if(d>fd){fd=d;fi=i}}
  const r1=dpKeep(P.slice(0,fi+1),eps),r2=dpKeep(P.slice(fi).concat([P[0]]),eps);
  return r1.concat(r2.slice(1,-1));
}
const loopArea=P=>{let a=0;for(let i=0;i<P.length;i++){const j=(i+1)%P.length;a+=P[i][0]*P[j][1]-P[j][0]*P[i][1]}return Math.abs(a)/2};
function traceClean(m,W,H,eps){return traceMask(m,W,H).map(l=>simplifyLoop(l,eps)).filter(l=>l.length>=3&&loopArea(l)>=6)}

function mkCustom(src,loops,ox,oy,k,key,keepText){
  const wl=loops.map(l=>l.map(p=>[ox+p[0]/k,oy+p[1]/k]));
  let x0=1e12,y0=1e12,x1=-1e12,y1=-1e12;wl.forEach(l=>l.forEach(p=>{if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}));
  const w=Math.max(1,x1-x0),h=Math.max(1,y1-y0),c=JSON.parse(JSON.stringify(src));
  c.id=uid();c.type='custom';c.key=key;delete c.grp;delete c.chart;
  c.pts=wl.map(l=>l.map(p=>[+((p[0]-x0)/w).toFixed(5),+((p[1]-y0)/h).toFixed(5)]));
  c.x=+x0.toFixed(2);c.y=+y0.toFixed(2);c.w=+w.toFixed(2);c.h=+h.toFixed(2);c.rot=0;

function mergeShapes(op){
  const sl=S(),L=selEls().filter(canMerge);
  if(L.length<2){toast('Chọn ít nhất 2 hình (không tính chữ, ảnh, đường thẳng) để hợp nhất. Giữ Shift + nhấp hoặc kéo khung chọn.',4200);return}
  if(op==='fragment'&&L.length>14){toast('Phân mảnh tối đa 14 hình một lần.',3500);return}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  L.forEach(e=>{const cx=e.x+e.w/2,cy=e.y+e.h/2,r=(e.rot||0)*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{const px=cx+a*e.w/2*c-b*e.h/2*s,py=cy+a*e.w/2*s+b*e.h/2*c;x0=Math.min(x0,px);x1=Math.max(x1,px);y0=Math.min(y0,py);y1=Math.max(y1,py)})});
  const pad=2,ox=x0-pad,oy=y0-pad,bw=x1-x0+pad*2,bh=y1-y0+pad*2,k=Math.min(80,1800/Math.max(bw,bh,1)),W=Math.max(8,Math.ceil(bw*k)),H=Math.max(8,Math.ceil(bh*k));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d',{willReadFrequently:true});
  const masks=L.map(e=>{
    g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
    g.setTransform(k,0,0,k,-ox*k,-oy*k);g.translate(e.x+e.w/2,e.y+e.h/2);g.rotate((e.rot||0)*Math.PI/180);g.translate(-e.w/2,-e.h/2);
    g.fillStyle='#000';g.fill(new Path2D(pathOfEl(e)),'evenodd');
    const d=g.getImageData(0,0,W,H).data,m=new Uint8Array(W*H);for(let i=0,n=W*H;i<n;i++)m[i]=d[i*4+3]>127?1:0;return m});

  const eps=1.4,zIdx=e=>sl.els.indexOf(e),first=L[0],insertAt=Math.min(...L.map(zIdx));

        if(x<W-1&&!vis[i+1]&&lab[i+1]===lb){vis[i+1]=1;stack[sp++]=i+1}
        if(y>0&&!vis[i-W]&&lab[i-W]===lb){vis[i-W]=1;stack[sp++]=i-W}
        if(y<H-1&&!vis[i+W]&&lab[i+W]===lb){vis[i+W]=1;stack[sp++]=i+W}}

      const sw=bx1-bx0+1,sh=by1-by0+1,sub=new Uint8Array(sw*sh);list.forEach(i=>{sub[((i/W|0)-by0)*sw+(i%W-bx0)]=1});

      out.push(mkCustom(best||L[0],loops,ox,oy,k,'',false));comps++;

  }else{
    const res=new Uint8Array(N),n=L.length;
    for(let i=0;i<N;i++){

    out.push(mkCustom(first,loops,ox,oy,k,'',true));

  sl.els=sl.els.filter(e=>!ids.has(e.id));sl.anims=sl.anims.filter(a=>!ids.has(a.el));
  out.forEach((c,i)=>{c.key=uniqueKey(sl,MRG[op].l+(out.length>1?' '+(i+1):''));sl.els.splice(Math.min(insertAt+i,sl.els.length),0,c)});
  setMulti(out.map(c=>c.id));selAnim=null;snap();renderAll();

}

/* 👍 / 👎 giữ để tiếp / lùi · ✌ giữ để bật/tắt bút vẽ */
const _upd=GestureEngine.prototype.update;
GestureEngine.prototype.update=function(lm,t){
  const c=_upd.call(this,lm,t),X=this._x||(this._x={k:null,t0:0,done:false,last:-1e9});
  let kind=null;
  if(!c.pinch){
    const s=c.size,e=c.ext;
    if(!e[0]&&!e[1]&&!e[2]&&!e[3]){
      const out=this.d(lm[4],lm[5])/s>.8,dy=(lm[2].y-lm[4].y)/s;
      if(out&&dy>.55)kind='tu';else if(out&&dy<-.55)kind='td';
    }else if(e[0]&&e[1]&&!e[2]&&!e[3]&&this.d(lm[8],lm[12])/s>.3)kind='peace';
  }
  if(kind==='tu'||kind==='td'){this.fistT=0;this.fistDone=true}
  if(kind&&kind===X.k){
    if(!X.t0)X.t0=t;const p=Math.min(1,(t-X.t0)/(kind==='peace'?800:650));
    this.on({type:'hold',kind,p});
    if(p>=1&&!X.done&&t-X.last>1200){X.done=true;X.last=t;this.on({type:'gtrig',kind})}
  }else{X.k=kind;X.t0=0;X.done=false}
  return c;
};
const _hh=HandCtl.handle;

  if(e.type==='gtrig'){

/* chọn tay chính, chống nhấp nháy khi tay mất/hiện thoáng qua, không bị khóa khi có tay thứ hai trong khung */
HandCtl.results=function(r){
  const t=performance.now();if(this.lastT)this.fps=this.fps*.9+(1000/Math.max(1,t-this.lastT))*.1;this.lastT=t;
  const hs=(r&&r.multiHandLandmarks)||[];this.draw(hs);
  if(!this.eng)return;const en=this.eng;en.scr=en.scrFix||[innerWidth,innerHeight];
  const f=$('#hFps');if(f)f.textContent=Math.round(this.fps)+' fps';
  if(hs.length)this._miss=0;else this._miss=(this._miss||0)+1;
  if(hs.length!==1)this._one=0;
  if(hs.length>=2){
    const a=en.classify(hs[0],en.t2.a),b=en.classify(hs[1],en.t2.b);
    if((a.pinch&&b.pinch)||en.t2.on){en.two(hs[0],hs[1],t);return}
    /* hai tay nhưng chưa cùng chụm → vẫn điều khiển bằng tay "chính" */
    let pick=0;
    if(en.last&&en.vis){const q=hs.map(h=>{const m=en.mapPt(h[8]);return Math.hypot(m.x-en.last.x,m.y-en.last.y)});pick=q[1]<q[0]?1:0}
    else{const rank=c=>c.pinch?3:c.pose==='point'?2:c.pose==='palm'?1:0;pick=rank(b)>rank(a)?1:0}
    en.twoEnd();en.update(hs[pick],t);return;
  }
  if(hs.length===1){
    if(en.t2.on&&(this._one=(this._one||0)+1)<4)return;   // giữ nhịp 3 khung khi một tay vừa rời
    en.update(hs[0],t);return;
  }
  if(this._miss<6)return;                                   // mất tay < 6 khung: coi như nhiễu
  en.twoEnd();en.lost(t);
};
