<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hộp Mù May Mắn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#12081f;
    --bg-mid:#2a1147;
    --glow:#ffd166;
    --box-a:#ff5fae;
    --box-b:#9b4dff;
    --lid:#ffc4de;
    --mint:#4af0d0;
    --cream:#fff7ed;
    --plum:#2b1b4d;
    --ink:#f6efff;
    --ink-dim:#c9baef;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:linear-gradient(125deg, var(--bg-deep), var(--bg-mid), #3d1660, var(--bg-deep));
    background-size:300% 300%;
    animation:bgShift 14s ease-in-out infinite;
    color:var(--ink);
    font-family:"Be Vietnam Pro", sans-serif;
  }
  @keyframes bgShift{
    0%{ background-position:0% 30%; }
    50%{ background-position:100% 70%; }
    100%{ background-position:0% 30%; }
  }

  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    z-index:0;
    pointer-events:none;
    opacity:0.55;
    animation:blobDrift 10s ease-in-out infinite;
  }
  .blob-a{ width:38vw; height:38vw; top:-14vw; left:-10vw; background:radial-gradient(circle, #ff5fae, transparent 70%); }
  .blob-b{ width:34vw; height:34vw; bottom:-16vw; right:-8vw; background:radial-gradient(circle, #9b4dff, transparent 70%); animation-delay:2s; }
  .blob-c{ width:26vw; height:26vw; bottom:8vw; left:6vw; background:radial-gradient(circle, #4af0d0, transparent 70%); animation-delay:4s; opacity:0.35; }
  @keyframes blobDrift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(2vw,-2vw) scale(1.12); }
  }

  #stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    border-radius:50%;
    background:#fff;
    animation:twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.12; transform:scale(0.7); }
    50%{ opacity:1; transform:scale(1.4); }
  }

  .frame{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    border:5px solid transparent;
    border-image:conic-gradient(from 0deg, #ff5fae, #ffd166, #4af0d0, #9b4dff, #ff5fae) 1;
    animation:spinHue 5s linear infinite;
  }
  @keyframes spinHue{ to{ filter:hue-rotate(360deg); } }

  .stage{
    position:relative;
    z-index:1;
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.6vh;
    padding:2.2vh 3vw;
    text-align:center;
  }

  h1{
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:clamp(22px, 3.6vw, 38px);
    margin:0;
    letter-spacing:0.5px;
    background:linear-gradient(90deg, #ff8fd0, #ffd166, #4af0d0, #9b4dff, #ff8fd0);
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleShine 4s linear infinite, wiggle 2.4s ease-in-out infinite;
  }
  @keyframes titleShine{ to{ background-position:300% center; } }
  @keyframes wiggle{
    0%,100%{ transform:rotate(0deg) scale(1); }
    50%{ transform:rotate(-1.2deg) scale(1.02); }
  }

  .subtitle{
    margin:0;
    color:var(--ink-dim);
    font-size:clamp(11px, 1.3vw, 15px);
    max-width:460px;
  }

  /* ---------- MAIN ROW ---------- */
  .main-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(20px, 5vw, 70px);
    flex:1;
    min-height:0;
    width:100%;
  }

  /* ---------- BOX ---------- */
  .box-zone{
    position:relative;
    width:clamp(140px, 20vw, 220px);
    height:clamp(150px, 30vh, 230px);
    flex-shrink:0;
  }

  .sun-rays{
    position:absolute;
    inset:-30%;
    border-radius:50%;
    background:repeating-conic-gradient(from 0deg, rgba(255,209,102,0.28) 0deg 8deg, transparent 8deg 20deg);
    animation:spinRaysRev 9s linear infinite;
    mix-blend-mode:screen;
  }
  @keyframes spinRaysRev{ to{ transform:rotate(-360deg); } }

  .glow-ring{
    position:absolute;
    inset:8%;
    border-radius:50%;
    background:conic-gradient(from 0deg, #ff5fae, #ffd166, #4af0d0, #9b4dff, #ff5fae);
    filter:blur(20px);
    opacity:0.6;
    animation:spinRing 5s linear infinite, pulseRing 2s ease-in-out infinite;
  }
  @keyframes spinRing{ to{ transform:rotate(360deg); } }
  @keyframes pulseRing{
    0%,100%{ opacity:0.45; }
    50%{ opacity:0.85; }
  }

  .ring-pulse{
    position:absolute;
    left:50%; bottom:22%;
    width:40%; height:40%;
    border-radius:50%;
    border:2px solid var(--glow);
    transform:translate(-50%,50%) scale(0.3);
    opacity:0.9;
    animation:ringOut 0.9s ease-out forwards;
    pointer-events:none;
  }
  @keyframes ringOut{
    to{ transform:translate(-50%,50%) scale(2.6); opacity:0; }
  }

  .gift-box{
    position:absolute;
    left:50%;
    bottom:6%;
    transform:translateX(-50%);
    width:76%;
    height:66%;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease;
    animation:floaty 2.6s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform:translateX(-50%) translateY(0); }
    50%{ transform:translateX(-50%) translateY(-7%); }
  }
  .gift-box:active{ transform:translateX(-50%) scale(0.96); }

  .box-body{
    position:absolute;
    left:0; right:0; bottom:0;
    height:82%;
    background:linear-gradient(135deg, var(--box-a), var(--box-b));
    border-radius:6px 6px 12px 12px;
    box-shadow:
      0 18px 30px -12px rgba(0,0,0,0.6),
      inset 0 -10px 18px rgba(43,27,77,0.3),
      0 0 34px rgba(255,95,174,0.45);
    overflow:hidden;
  }
  .box-body::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:50%;
    width:22%;
    transform:translateX(-50%);
    background:linear-gradient(180deg, var(--glow), #ff9d3d);
  }
  .box-body::after{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
    animation:shine 2.4s ease-in-out infinite;
  }
  @keyframes shine{
    0%{ left:-60%; }
    45%,100%{ left:130%; }
  }

  .box-lid{
    position:absolute;
    left:-6%; right:-6%;
    top:13%;
    height:24%;
    background:linear-gradient(135deg, var(--lid), var(--box-b));
    border-radius:9px;
    box-shadow:0 10px 18px -8px rgba(0,0,0,0.5);
    transform-origin:50% 100%;
    transition:transform .55s cubic-bezier(.34,1.7,.64,1), opacity .4s ease;
    z-index:2;
  }
  .box-lid::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:50%;
    width:26%;
    transform:translateX(-50%);
    background:linear-gradient(180deg, var(--glow), #ff9d3d);
  }
  .box-lid::after{
    content:"";
    position:absolute;
    left:50%; top:-46%;
    width:32%; height:60%;
    transform:translateX(-50%);
    background:var(--glow);
    border-radius:50% 50% 40% 40%;
    box-shadow:-1.6em 0.15em 0 -0.4em var(--glow), 1.6em 0.15em 0 -0.4em var(--glow);
  }

  .gift-box.shake{ animation:shake .6s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(-50%) rotate(0) translateY(0); }
    10%{ transform:translateX(-50%) rotate(-9deg) translateY(-4%); }
    25%{ transform:translateX(-50%) rotate(8deg) translateY(0); }
    40%{ transform:translateX(-50%) rotate(-8deg) translateY(-5%); }
    55%{ transform:translateX(-50%) rotate(7deg) translateY(0); }
    70%{ transform:translateX(-50%) rotate(-5deg) translateY(-2%); }
    85%{ transform:translateX(-50%) rotate(3deg) translateY(0); }
  }

  .gift-box.open{ animation:none; }
  .gift-box.open .box-lid{
    transform:translateY(-160%) rotate(-35deg);
    opacity:0;
  }
  .gift-box.open .box-body{
    box-shadow:
      0 22px 36px -12px rgba(0,0,0,0.65),
      inset 0 -10px 18px rgba(43,27,77,0.3),
      0 0 60px rgba(255,209,102,0.6);
  }

  .flash{
    position:absolute;
    left:50%; top:38%;
    width:16px; height:16px;
    border-radius:50%;
    background:radial-gradient(circle, #fff, rgba(255,209,102,0.6) 40%, transparent 70%);
    transform:translate(-50%,-50%) scale(0);
    animation:flashPop .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes flashPop{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(10); opacity:0; }
  }

  #confetti{
    position:absolute;
    inset:-10% 0 auto 0;
    height:1px;
    overflow:visible;
    pointer-events:none;
  }
  .confetti-piece{
    position:absolute;
    top:0; left:0;
    opacity:0.95;
    animation:fall 1.2s ease-in forwards;
  }
  .confetti-piece.rect{ width:8px; height:12px; border-radius:2px; }
  .confetti-piece.circle{ width:9px; height:9px; border-radius:50%; }
  .confetti-piece.star{
    width:11px; height:11px;
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  @keyframes fall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--drift), 220px) rotate(var(--spin)); opacity:0; }
  }

  /* ---------- REVEAL PANEL (fixed size, no layout jump) ---------- */
  .reveal-panel{
    position:relative;
    width:clamp(200px, 24vw, 300px);
    height:clamp(150px, 30vh, 230px);
    flex-shrink:0;
  }
  .reveal-panel::before{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:20px;
    background:conic-gradient(from 0deg, #ff5fae, #ffd166, #4af0d0, #9b4dff, #ff5fae);
    animation:spinRing 3s linear infinite;
    z-index:0;
  }
  .panel-inner{
    position:absolute;
    inset:0;
    border-radius:16px;
    background:var(--cream);
    overflow:hidden;
  }

  .idle-state, .result-card{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px 16px;
    transition:opacity .35s ease, transform .35s ease;
  }
  .idle-state{
    color:#a3936a;
  }
  .idle-state .spark{
    font-size:clamp(22px, 3.2vw, 30px);
    color:var(--glow);
    text-shadow:0 0 14px rgba(255,209,102,0.8);
    animation:spinBounce 2.8s ease-in-out infinite;
  }
  @keyframes spinBounce{
    0%,100%{ transform:rotate(0deg) translateY(0); }
    25%{ transform:rotate(90deg) translateY(-4px); }
    50%{ transform:rotate(180deg) translateY(0); }
    75%{ transform:rotate(270deg) translateY(-4px); }
  }
  .idle-state p{
    margin:8px 0 0;
    font-size:clamp(11px, 1.3vw, 13.5px);
    line-height:1.4;
  }

  .result-card{
    color:var(--plum);
    opacity:0;
    transform:scale(0.85) rotate(-3deg);
    pointer-events:none;
  }
  .reveal-panel.open .idle-state{
    opacity:0;
    transform:scale(0.85);
  }
  .reveal-panel.open .result-card{
    opacity:1;
    transform:scale(1) rotate(0deg);
  }

  .result-label{
    font-size:clamp(10px, 1.1vw, 12px);
    color:#a3936a;
    margin:0 0 4px;
    font-weight:600;
    letter-spacing:0.3px;
  }
  .result-name{
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:clamp(20px, 3.4vw, 32px);
    margin:0;
    word-break:break-word;
    background:linear-gradient(90deg,#ff5fae,#9b4dff,#3fc9c9,#ff9d3d,#ff5fae);
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleShine 3s linear infinite;
  }
  .result-divider{
    border:none;
    border-top:2px dashed #e4d7bd;
    margin:10px 0 8px;
    width:70%;
  }
  .result-sub{
    font-size:clamp(9px, 1vw, 11.5px);
    color:#8a7c5c;
    margin:0;
  }

  .hint{
    font-size:clamp(10px, 1.1vw, 13px);
    color:var(--ink-dim);
  }

  /* ---------- BOTTOM ROW ---------- */
  .bottom-row{
    width:100%;
    max-width:820px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(10px, 2vw, 20px);
    flex-wrap:wrap;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.16);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:999px;
    padding:0.9vh 1.6vw;
    box-shadow:0 10px 30px -14px rgba(0,0,0,0.5);
  }
  .history-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    align-items:center;
  }
  .history-list .label{
    font-size:clamp(10px, 1.1vw, 12.5px);
    color:var(--ink-dim);
    margin-right:4px;
    font-weight:600;
  }
  .chip{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.18);
    color:var(--ink);
    padding:4px 11px 4px 8px;
    border-radius:999px;
    font-size:clamp(10px, 1.1vw, 12.5px);
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .chip::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background:var(--dot, #ff5fae);
    flex-shrink:0;
  }
  .chip:first-of-type{
    background:linear-gradient(90deg, rgba(255,95,174,0.3), rgba(155,77,255,0.3));
    border-color:rgba(255,209,102,0.7);
    color:var(--glow);
    box-shadow:0 0 12px rgba(255,209,102,0.4);
  }
  .empty-note{
    color:var(--ink-dim);
    font-size:clamp(10px, 1.1vw, 12.5px);
  }

  .again-btn{
    background:transparent;
    border:2px solid var(--mint);
    color:var(--mint);
    font-family:"Be Vietnam Pro", sans-serif;
    font-weight:600;
    font-size:clamp(11px, 1.2vw, 13.5px);
    padding:6px 18px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .2s ease, color .2s ease, box-shadow .2s ease, opacity .2s ease;
    opacity:0;
    pointer-events:none;
  }
  .again-btn.show{
    opacity:1;
    pointer-events:auto;
  }
  .again-btn:hover{
    background:var(--mint);
    color:var(--plum);
    box-shadow:0 0 18px rgba(74,240,208,0.6);
  }

  details.list-toggle summary{
    cursor:pointer;
    color:var(--ink-dim);
    font-size:clamp(10px, 1.1vw, 12.5px);
    list-style:none;
    white-space:nowrap;
  }
  details.list-toggle summary::-webkit-details-marker{ display:none; }
  details.list-toggle summary::before{ content:"▸ "; }
  details.list-toggle[open] summary::before{ content:"▾ "; }

  .all-names-pop{
    position:fixed;
    bottom:6vh;
    left:50%;
    transform:translateX(-50%);
    background:var(--cream);
    color:var(--plum);
    border-radius:14px;
    padding:14px 20px;
    font-size:12px;
    line-height:1.8;
    columns:3;
    column-gap:20px;
    box-shadow:0 20px 40px -14px rgba(0,0,0,0.6);
    z-index:5;
    max-width:70vw;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }

  @media (max-width:720px), (max-aspect-ratio:1/1){
    html,body{ overflow-y:auto; height:auto; }
    .stage{ height:auto; min-height:100vh; }
    .main-row{ flex-direction:column; }
    .all-names-pop{ columns:2; }
  }
</style>
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>
<div class="blob blob-c"></div>
<div id="stars"></div>
<div class="frame"></div>

<div class="stage">
  <h1>Hộp Mù May Mắn</h1>
  <p class="subtitle">Nhấn vào hộp để mở — tên ai xuất hiện, người đó "trúng số"!</p>

  <div class="main-row">
    <div class="box-zone">
      <div class="sun-rays"></div>
      <div class="glow-ring"></div>
      <div id="confetti"></div>
      <div class="gift-box" id="box">
        <div class="box-lid"></div>
        <div class="box-body"></div>
      </div>
    </div>

    <div class="reveal-panel" id="revealPanel">
      <div class="panel-inner">
        <div class="idle-state" id="idleState">
          <div class="spark">✦</div>
          <p>Kết quả sẽ<br>hiện ra ở đây</p>
        </div>
        <div class="result-card">
          <p class="result-label">✦ BẠN ĐÃ MỞ ĐƯỢC ✦</p>
          <p class="result-name" id="resultName">—</p>
          <hr class="result-divider">
          <p class="result-sub">Lượt mở số <span id="pullNo">0</span></p>
        </div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">Chạm vào hộp để mở</div>

  <div class="bottom-row">
    <button class="again-btn" id="againBtn">Mở hộp khác</button>
    <div class="history-list" id="historyList">
      <span class="label">Lịch sử:</span>
      <span class="empty-note">chưa có ai được mở</span>
    </div>
    <span> · <span id="count">0</span> lượt</span>
    <details class="list-toggle" id="listToggle">
      <summary>37 tên trong hộp</summary>
    </details>
  </div>
</div>

<script>
  const names = ["Đức","Bảo Hân","Võ My","Nhi An","Tiến","Gia Như","Quý","Ngọc","Kiệt","Nhân","Tùng","Thảo Ly","Vỹ","Thùy An","Trâm","Bảo Nhi","Ng My","Bảo Châu","Anh Thư","P.Huy","Ngọc Nhi","Oanh","Thảo Nguyên","Đ.Huy","Huy Hoàng","Khánh Ly","Linh","Quốc","Cái Ý","Trần Ý","Tài","Quỳnh Như","Phúc","Lan Anh","Nhật","P.Vy","Toàn"];

  // ambient twinkling stars
  const starHost = document.getElementById('stars');
  for(let i = 0; i < 60; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = (Math.random() * 2.2 + 1).toFixed(1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    starHost.appendChild(s);
  }

  const box = document.getElementById('box');
  const boxZone = document.querySelector('.box-zone');
  const hint = document.getElementById('hint');
  const revealPanel = document.getElementById('revealPanel');
  const resultName = document.getElementById('resultName');
  const pullNo = document.getElementById('pullNo');
  const againBtn = document.getElementById('againBtn');
  const historyList = document.getElementById('historyList');
  const countEl = document.getElementById('count');
  const confettiHost = document.getElementById('confetti');
  const listToggle = document.getElementById('listToggle');

  listToggle.addEventListener('toggle', () => {
    let pop = document.getElementById('namesPop');
    if(listToggle.open){
      if(!pop){
        pop = document.createElement('div');
        pop.id = 'namesPop';
        pop.className = 'all-names-pop';
        pop.innerHTML = names.map(n => `<div>${n}</div>`).join('');
        document.body.appendChild(pop);
      }
    } else if(pop){
      pop.remove();
    }
  });

  let history = [];
  let isAnimating = false;

  function pickName(){
    return names[Math.floor(Math.random() * names.length)];
  }

  function spawnConfetti(){
    const colors = ['#ffd166','#ff5fae','#9b4dff','#4af0d0','#ff9d3d','#ffffff'];
    const shapes = ['rect','circle','star'];
    for(let i = 0; i < 80; i++){
      const el = document.createElement('div');
      el.className = 'confetti-piece ' + shapes[Math.floor(Math.random() * shapes.length)];
      el.style.left = (Math.random() * 100) + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
      el.style.setProperty('--spin', (Math.random() * 500 - 250) + 'deg');
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      el.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
      confettiHost.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }
  }

  function spawnFlash(){
    const f = document.createElement('div');
    f.className = 'flash';
    boxZone.appendChild(f);
    setTimeout(() => f.remove(), 600);
  }

  function spawnRings(){
    for(let i = 0; i < 2; i++){
      const r = document.createElement('div');
      r.className = 'ring-pulse';
      r.style.animationDelay = (i * 0.18) + 's';
      boxZone.appendChild(r);
      setTimeout(() => r.remove(), 1200);
    }
  }

  const dotColors = ['#ff5fae','#ffd166','#4af0d0','#9b4dff','#ff9d3d'];

  function updateHistory(){
    countEl.textContent = history.length;
    if(history.length === 0){
      historyList.innerHTML = '<span class="label">Lịch sử:</span><span class="empty-note">chưa có ai được mở</span>';
      return;
    }
    historyList.innerHTML = '<span class="label">Lịch sử:</span>' +
      history.slice(0, 10).map((n, i) =>
        `<span class="chip" style="--dot:${dotColors[i % dotColors.length]}">${n}</span>`
      ).join('');
  }

  box.addEventListener('click', () => {
    if (isAnimating || box.classList.contains('open')) return;
    isAnimating = true;
    hint.textContent = '';
    box.classList.add('shake');

    setTimeout(() => {
      box.classList.remove('shake');
      box.classList.add('open');
      spawnConfetti();
      spawnFlash();
      spawnRings();

      setTimeout(() => {
        const pick = pickName();
        history.unshift(pick);
        resultName.textContent = pick;
        pullNo.textContent = history.length;
        revealPanel.classList.add('open');
        againBtn.classList.add('show');
        updateHistory();
        isAnimating = false;
      }, 420);
    }, 560);
  });

  againBtn.addEventListener('click', () => {
    revealPanel.classList.remove('open');
    againBtn.classList.remove('show');
    box.classList.remove('open');
    hint.textContent = 'Chạm vào hộp để mở';
  });
</script>

</body>
</html>
