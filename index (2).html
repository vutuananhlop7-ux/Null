<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hộp Mù May Mắn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#150e2a;
    --bg-mid:#241a45;
    --glow:#ffd166;
    --box-a:#ff8fb1;
    --box-b:#c29fff;
    --lid:#ffb8d2;
    --mint:#8fe3cf;
    --cream:#fff7ed;
    --plum:#2b1b4d;
    --ink:#efe9ff;
    --ink-dim:#b7abda;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 70% 45% at 50% 28%, rgba(255,209,102,0.16), transparent 60%),
      radial-gradient(ellipse 90% 60% at 50% 100%, rgba(194,159,255,0.18), transparent 60%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-mid));
    color:var(--ink);
    font-family:"Be Vietnam Pro", sans-serif;
    overflow-x:hidden;
  }

  .stage{
    max-width:640px;
    margin:0 auto;
    padding:56px 20px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    position:relative;
  }

  h1{
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:clamp(30px, 6vw, 44px);
    margin:0 0 10px;
    letter-spacing:0.5px;
    color:#fff;
  }

  .subtitle{
    margin:0 0 48px;
    color:var(--ink-dim);
    font-size:16px;
    max-width:380px;
    line-height:1.5;
  }

  /* ---------- BOX ---------- */
  .box-zone{
    position:relative;
    width:220px;
    height:230px;
    margin-bottom:18px;
  }

  .glow-pad{
    position:absolute;
    inset:-40px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,209,102,0.35), transparent 65%);
    filter:blur(4px);
    opacity:0.8;
    transition:opacity .4s ease;
  }

  .gift-box{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:172px;
    height:150px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease;
  }
  .gift-box:active{ transform:translateX(-50%) scale(0.97); }

  .box-body{
    position:absolute;
    left:0; right:0; bottom:0;
    height:120px;
    background:linear-gradient(135deg, var(--box-a), var(--box-b));
    border-radius:6px 6px 10px 10px;
    box-shadow:
      0 18px 30px -12px rgba(0,0,0,0.55),
      inset 0 -10px 18px rgba(43,27,77,0.25);
  }
  .box-body::before{ /* vertical ribbon */
    content:"";
    position:absolute;
    top:0; bottom:0; left:50%;
    width:26px;
    transform:translateX(-50%);
    background:linear-gradient(180deg, var(--glow), #ffb84d);
  }

  .box-lid{
    position:absolute;
    left:-8px; right:-8px;
    top:20px;
    height:34px;
    background:linear-gradient(135deg, var(--lid), var(--box-b));
    border-radius:8px;
    box-shadow:0 10px 16px -8px rgba(0,0,0,0.45);
    transform-origin:50% 100%;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .4s ease;
    z-index:2;
  }
  .box-lid::before{ /* ribbon on lid */
    content:"";
    position:absolute;
    top:0; bottom:0; left:50%;
    width:30px;
    transform:translateX(-50%);
    background:linear-gradient(180deg, var(--glow), #ffb84d);
  }
  .box-lid::after{ /* bow */
    content:"";
    position:absolute;
    left:50%; top:-16px;
    width:34px; height:22px;
    transform:translateX(-50%);
    background:var(--glow);
    border-radius:50% 50% 40% 40%;
    box-shadow:-20px 2px 0 -6px var(--glow), 20px 2px 0 -6px var(--glow);
  }

  .gift-box.shake{ animation:shake .55s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(-50%) rotate(0); }
    15%{ transform:translateX(-50%) rotate(-6deg); }
    30%{ transform:translateX(-50%) rotate(5deg); }
    45%{ transform:translateX(-50%) rotate(-5deg); }
    60%{ transform:translateX(-50%) rotate(4deg); }
    75%{ transform:translateX(-50%) rotate(-3deg); }
  }

  .gift-box.open .box-lid{
    transform:translateY(-46px) rotate(-18deg);
    opacity:0;
  }
  .gift-box.open .box-body{
    box-shadow:
      0 22px 34px -12px rgba(0,0,0,0.6),
      inset 0 -10px 18px rgba(43,27,77,0.25),
      0 0 0 3px rgba(255,209,102,0.4);
  }
  .gift-box.open .glow-pad{ opacity:1; }

  .hint{
    font-size:13px;
    color:var(--ink-dim);
    letter-spacing:0.3px;
    height:18px;
  }

  /* ---------- CONFETTI ---------- */
  #confetti{
    position:absolute;
    inset:-20px 0 auto 0;
    height:1px;
    overflow:visible;
    pointer-events:none;
  }
  .confetti-piece{
    position:absolute;
    top:0;
    width:8px; height:12px;
    border-radius:2px;
    opacity:0.95;
    animation:fall 1.1s ease-in forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(230px) rotate(340deg); opacity:0; }
  }

  /* ---------- RESULT TICKET ---------- */
  .result-card{
    width:100%;
    max-width:320px;
    background:var(--cream);
    color:var(--plum);
    border-radius:16px;
    padding:26px 20px 22px;
    position:relative;
    box-shadow:0 24px 40px -18px rgba(0,0,0,0.55);
    opacity:0;
    transform:translateY(18px) scale(0.94);
    transition:opacity .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
    margin-top:6px;
  }
  .result-card.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .result-card::before,.result-card::after{
    content:"";
    position:absolute;
    width:22px; height:22px;
    background:var(--bg-mid);
    border-radius:50%;
    top:50%;
    transform:translateY(-50%);
  }
  .result-card::before{ left:-11px; }
  .result-card::after{ right:-11px; }

  .result-label{
    font-size:12.5px;
    color:#a3936a;
    margin:0 0 6px;
    font-weight:600;
  }
  .result-name{
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:clamp(26px, 6vw, 32px);
    margin:0;
    word-break:break-word;
  }
  .result-divider{
    border:none;
    border-top:2px dashed #e4d7bd;
    margin:16px 0 12px;
  }
  .result-sub{
    font-size:13px;
    color:#8a7c5c;
    margin:0;
  }

  .again-btn{
    margin-top:22px;
    background:transparent;
    border:2px solid var(--mint);
    color:var(--mint);
    font-family:"Be Vietnam Pro", sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:11px 26px;
    border-radius:999px;
    cursor:pointer;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .4s ease .1s, transform .4s ease .1s, background .2s ease, color .2s ease;
    pointer-events:none;
  }
  .again-btn.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .again-btn:hover{ background:var(--mint); color:var(--plum); }

  /* ---------- HISTORY ---------- */
  .history-block{
    margin-top:56px;
    width:100%;
    border-top:1px solid rgba(255,255,255,0.12);
    padding-top:22px;
  }
  .history-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
  }
  .history-head h2{
    font-family:"Baloo 2", sans-serif;
    font-size:16px;
    margin:0;
    color:#fff;
    font-weight:700;
  }
  .history-head span{
    font-size:13px;
    color:var(--ink-dim);
  }
  .history-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    min-height:32px;
  }
  .chip{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    color:var(--ink);
    padding:7px 14px;
    border-radius:999px;
    font-size:13.5px;
  }
  .chip:first-child{
    background:rgba(255,209,102,0.16);
    border-color:rgba(255,209,102,0.5);
    color:var(--glow);
  }
  .empty-note{
    color:var(--ink-dim);
    font-size:13px;
  }

  /* ---------- NAME LIST ---------- */
  details.list-toggle{
    margin-top:28px;
    width:100%;
  }
  details.list-toggle summary{
    cursor:pointer;
    color:var(--ink-dim);
    font-size:13px;
    list-style:none;
  }
  details.list-toggle summary::-webkit-details-marker{ display:none; }
  details.list-toggle summary::before{
    content:"▸ ";
  }
  details.list-toggle[open] summary::before{
    content:"▾ ";
  }
  .all-names{
    margin-top:12px;
    font-size:12.5px;
    color:var(--ink-dim);
    line-height:1.9;
    text-align:left;
    background:rgba(255,255,255,0.04);
    border-radius:10px;
    padding:14px 16px;
    columns:2;
  }

  @media (max-width:380px){
    .all-names{ columns:1; }
  }
</style>
</head>
<body>

<div class="stage">
  <h1>Hộp Mù May Mắn</h1>
  <p class="subtitle">Nhấn vào hộp để mở — tên ai xuất hiện, người đó "trúng số"!</p>

  <div class="box-zone">
    <div class="glow-pad"></div>
    <div id="confetti"></div>
    <div class="gift-box" id="box">
      <div class="box-lid"></div>
      <div class="box-body"></div>
    </div>
  </div>
  <div class="hint" id="hint">Chạm vào hộp</div>

  <div class="result-card" id="resultCard">
    <p class="result-label">BẠN ĐÃ MỞ ĐƯỢC</p>
    <p class="result-name" id="resultName">—</p>
    <hr class="result-divider">
    <p class="result-sub">Lượt mở số <span id="pullNo">0</span></p>
  </div>

  <button class="again-btn" id="againBtn">Mở hộp khác</button>

  <div class="history-block">
    <div class="history-head">
      <h2>Lịch sử mở hộp</h2>
      <span><span id="count">0</span> lượt</span>
    </div>
    <div class="history-list" id="historyList">
      <span class="empty-note">Chưa có ai được mở cả — hãy là người đầu tiên!</span>
    </div>
  </div>

  <details class="list-toggle">
    <summary>Xem danh sách 37 tên trong hộp</summary>
    <div class="all-names" id="allNames"></div>
  </details>
</div>

<script>
  const names = ["Đức","Bảo Hân","Võ My","Nhi An","Tiến","Gia Như","Quý","Ngọc","Kiệt","Nhân","Tùng","Thảo Ly","Vỹ","Thùy An","Trâm","Bảo Nhi","Ng My","Bảo Châu","Anh Thư","P.Huy","Ngọc Nhi","Oanh","Thảo Nguyên","Đ.Huy","Huy Hoàng","Khánh Ly","Linh","Quốc","Cái Ý","Trần Ý","Tài","Quỳnh Như","Phúc","Lan Anh","Nhật","P.Vy","Toàn"];

  document.getElementById('allNames').innerHTML = names.map(n => `<div>${n}</div>`).join('');

  const box = document.getElementById('box');
  const hint = document.getElementById('hint');
  const resultCard = document.getElementById('resultCard');
  const resultName = document.getElementById('resultName');
  const pullNo = document.getElementById('pullNo');
  const againBtn = document.getElementById('againBtn');
  const historyList = document.getElementById('historyList');
  const countEl = document.getElementById('count');
  const confettiHost = document.getElementById('confetti');

  let history = [];
  let isAnimating = false;

  function pickName(){
    return names[Math.floor(Math.random() * names.length)];
  }

  function spawnConfetti(){
    const colors = ['#ffd166','#ff8fb1','#c29fff','#8fe3cf','#ffffff'];
    for(let i = 0; i < 42; i++){
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = (Math.random() * 100) + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDelay = (Math.random() * 0.25) + 's';
      confettiHost.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }
  }

  function updateHistory(){
    countEl.textContent = history.length;
    historyList.innerHTML = history.slice(0, 14)
      .map(n => `<span class="chip">${n}</span>`).join('');
  }

  box.addEventListener('click', () => {
    if (isAnimating || box.classList.contains('open')) return;
    isAnimating = true;
    hint.textContent = '';
    box.classList.add('shake');

    setTimeout(() => {
      box.classList.remove('shake');
      box.classList.add('open');
      spawnConfetti();

      setTimeout(() => {
        const pick = pickName();
        history.unshift(pick);
        resultName.textContent = pick;
        pullNo.textContent = history.length;
        resultCard.classList.add('show');
        againBtn.classList.add('show');
        updateHistory();
        isAnimating = false;
      }, 420);
    }, 560);
  });

  againBtn.addEventListener('click', () => {
    resultCard.classList.remove('show');
    againBtn.classList.remove('show');
    box.classList.remove('open');
    hint.textContent = 'Chạm vào hộp';
  });
</script>

</body>
</html>
